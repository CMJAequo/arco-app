// The single "now" phase, by priority: dipWalk > supplement due > meal > cognitive >
// physicalPeak, falling back to a steady gap, or sleep outside the waking day. There is
// never a moment when nothing is true.
function getCurrentPhase(h, p){
  const wake = p.wakeTime ?? p.wake, bed = p.bedTime ?? p.bed;
  if(wake == null || bed == null) return null;
  let wins; try{ wins = getDayWindows(p); }catch(e){ return null; }
  const bn = {}; wins.forEach(w => bn[w.name] = w);
  const on = w => w && h >= w.start && h < w.end;
  if(on(bn.dipWalk)) return { key:'dipWalk', start:bn.dipWalk.start, end:bn.dipWalk.end };
  const due = (p.supplements||[]).map(k=>supView(k,p)).filter(s => s && !s.anytime && !takenToday.includes(s.key) && h >= s.window[0] && h < s.window[1]).sort((a,b)=>a.window[0]-b.window[0])[0];
  if(due) return { key:'supplement', sup:due, start:due.window[0], end:due.window[1] };
  const meal = ['breakfast','lunch','mainMeal','postTraining'].map(n=>bn[n]).filter(Boolean).find(on);
  if(meal) return { key:meal.name, start:meal.start, end:meal.end };
  const cog = ['sleepInertia','deepWork','trough','secondWindow','windDown'].map(n=>bn[n]).filter(Boolean).find(on);
  if(cog) return { key:cog.name, start:cog.start, end:cog.end };
  if(on(bn.physicalPeak)) return { key:'physicalPeak', start:bn.physicalPeak.start, end:bn.physicalPeak.end };
  if(h >= wake && h < bed){
    const cw = ['sleepInertia','deepWork','trough','secondWindow','windDown'].map(n=>bn[n]).filter(Boolean).sort((a,b)=>a.start-b.start);
    let start = wake, end = bed;
    cw.forEach(w => { if(w.end <= h && w.end > start) start = w.end; });
    const nx = cw.find(w => w.start > h); if(nx) end = nx.start;
    return { key:'neutral', start, end };
  }
  return { key:'sleep', start:bed, end:wake };
}
// The next thing that begins at or after `after`: a window or an untaken dose.
function nextThing(after, p){
  let wins; try{ wins = getDayWindows(p); }catch(e){ return null; }
  const cands = [];
  wins.filter(w => w.name !== 'neutral').forEach(w => cands.push({ name:WINDOW_NAME[w.name] || w.name, time:w.start }));
  (p.supplements||[]).map(k=>supView(k,p)).filter(s => s && !s.anytime && !takenToday.includes(s.key))
    .forEach(s => cands.push({ name:(SHORT_NAME[s.key]||s.name), time:s.window[0] }));
  return cands.filter(c => c.time >= after - 0.001).sort((a,b)=>a.time-b.time)[0] || null;
}
// Always-on state card: plain language for what is happening now and what to do.
function stateCard(h, p){
  const ph = getCurrentPhase(h, p);
  if(!ph) return '';
  let name, line;
  if(ph.key === 'supplement'){ const s = ph.sup; name = (SHORT_NAME[s.key]||s.name) + ', due'; line = 'Take ' + s.dose + ' now.'; }
  else { name = WINDOW_NAME[ph.key] || ph.key; line = WINDOW_LINE[ph.key] || ''; }
  const timeRange = ph.key === 'sleep' ? '' : fmt(ph.start) + '–' + fmt(ph.end);
  const dur = ph.end - ph.start, pctv = dur > 0 ? Math.max(0, Math.min(100, ((h - ph.start) / dur) * 100)) : 0;
  const rem = Math.max(0, Math.round((ph.end - h) * 60));
  const remTxt = rem >= 60 ? Math.floor(rem/60) + 'h' + (rem%60 ? ' ' + (rem%60) + 'm' : '') : rem + 'm';
  const showBar = ph.key !== 'sleep' && ph.key !== 'neutral' && dur > 0;
  const nx = nextThing(ph.end, p);
  const nextTxt = nx ? `next: ${String(nx.name).toLowerCase()} at ${fmt(nx.time)}` : '';
  return `<div class="now-card" style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;">
      <span class="now-window-label" style="margin-bottom:0;">now · ${name}</span>
      ${timeRange ? `<span style="font-size:11px;color:rgba(237,233,225,0.4);flex-shrink:0;">${timeRange}</span>` : ''}
    </div>
    <div class="now-window-desc" style="margin-bottom:${showBar ? '12' : '10'}px;">${line}</div>
    ${showBar ? `<div class="now-window-bar"><div class="now-window-fill" style="width:${pctv}%;"></div></div>
    <div class="now-window-footer" style="margin-bottom:8px;">${remTxt} remaining</div>` : ''}
    ${nextTxt ? `<div class="now-window-footer">${nextTxt}</div>` : ''}
  </div>`;
}
function dayStripCard(){
  const p = profile, wake = p.wakeTime ?? p.wake, bed = p.bedTime ?? p.bed;
  if(wake == null || bed == null) return '';
  const span = bed - wake; if(span <= 0) return '';
  let wins; try{ wins = getDayWindows(p); }catch(e){ return ''; }
  const byName = {}; wins.forEach(w => byName[w.name] = w);
  // Gold/grey axis matching the clock. The gold→grey hue shift makes the trough read
  // as the valley without extra treatment.
  const TONE = { sharp:'rgba(214,158,52,0.92)', neutral:'rgba(203,181,138,0.6)', dull:'rgba(120,122,128,0.42)' };
  const toneOf = { sleepInertia:'dull', deepWork:'sharp', trough:'dull', secondWindow:'sharp', windDown:'dull' };
  const pct = t => ((t - wake) / span) * 100;
  const strip = ['sleepInertia','deepWork','trough','secondWindow','windDown']
    .map(n => byName[n]).filter(Boolean).sort((a,b) => a.start - b.start);
  let cursor = wake; const segs = [];
  strip.forEach(w => {
    const s = Math.max(w.start, wake), e = Math.min(w.end, bed);
    if(e <= s) return;
    if(s > cursor + 0.001) segs.push({ start:cursor, end:s, tone:'neutral', name:'neutral' });
    segs.push({ start:s, end:e, tone:toneOf[w.name], name:w.name });
    cursor = e;
  });
  if(cursor < bed - 0.001) segs.push({ start:cursor, end:bed, tone:'neutral', name:'neutral' });
  const segHtml = segs.map(sg => {
    const left = pct(sg.start), width = pct(sg.end) - pct(sg.start);
    // every segment (gaps included) is tappable
    return `<div onclick="openWindowPopup('${sg.name}',${+sg.start.toFixed(3)},${+sg.end.toFixed(3)})" style="position:absolute;top:0;bottom:0;left:${left}%;width:${width}%;background:${TONE[sg.tone]};cursor:pointer;"></div>`;
  }).join('');
  // physicalPeak — its own line below the strip, deep ink: a different measurement.
  let peakHtml = '';
  const pk = byName['physicalPeak'];
  if(pk){ const s = Math.max(pk.start, wake), e = Math.min(pk.end, bed);
    if(e > s) peakHtml = `<div onclick="openWindowPopup('physicalPeak',${+s.toFixed(3)},${+e.toFixed(3)})" style="position:absolute;top:0;bottom:0;left:${pct(s)}%;width:${pct(e)-pct(s)}%;background:rgba(26,22,18,0.72);border-radius:2px;cursor:pointer;"></div>`;
  }
  // Meals — small ink notches on the same timeline, a distinct category from the phase
  // blocks. Small tap zone so they don't swallow the underlying phase segment.
  const mealMarks = ['breakfast','lunch','mainMeal','postTraining'].map(n => byName[n]).filter(Boolean).map(m => {
    const s = Math.max(m.start, wake), e = Math.min(m.end, bed); if(e <= s) return '';
    return `<div onclick="event.stopPropagation();openWindowPopup('${m.name}',${+s.toFixed(3)},${+e.toFixed(3)})" style="position:absolute;top:0;height:18px;left:${pct((s+e)/2)}%;transform:translateX(-50%);width:24px;z-index:2;cursor:pointer;display:flex;justify-content:center;">
      <div style="width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid rgba(26,22,18,0.82);"></div></div>`;
  }).join('');
  const now = new Date(), h = now.getHours() + now.getMinutes()/60;
  const inDay = h >= wake && h < bed;
  const nowHtml = inDay
    ? `<div style="position:absolute;top:16px;bottom:0;left:${pct(h)}%;width:1.5px;background:rgba(232,82,10,0.95);z-index:3;pointer-events:none;"></div>` : '';
  // The one label: the current phase, at the now-line. Everything else stays unlabelled.
  let labelHtml = '';
  if(inDay){
    const ph = getCurrentPhase(h, p);
    if(ph){ const nm = ph.key === 'supplement' ? (SHORT_NAME[ph.sup.key]||ph.sup.name) : (WINDOW_NAME[ph.key]||ph.key);
      const lx = Math.max(9, Math.min(91, pct(h)));
      labelHtml = `<div style="position:absolute;top:0;left:${lx}%;transform:translateX(-50%);font-size:10px;color:rgba(26,22,18,0.55);white-space:nowrap;font-weight:600;letter-spacing:0.02em;">${String(nm).toLowerCase()}</div>`;
    }
  }
  // Label row on top, strip row, then physicalPeak on its own line; now-line spans strip+peak.
  return `<div style="margin:0 2px 12px;position:relative;padding-top:16px;">
    ${labelHtml}
    <div style="position:relative;height:30px;border-radius:6px;overflow:hidden;">${segHtml}${mealMarks}</div>
    <div style="position:relative;height:5px;margin-top:3px;">${peakHtml}</div>
    ${nowHtml}
  </div>`;
}

function dailyContradictionCard(){
  let fired;
  try{ fired = runContradictions(toContradictionProfile(profile)).fired; }catch(e){ return ''; }
  if(!fired || !fired.length) return '';
  const today = new Date().toDateString();
  let shown=[]; try{ shown=JSON.parse(localStorage.getItem('arco-contradictions-shown')||'[]'); }catch(e){}
  let rec=null; try{ rec=JSON.parse(localStorage.getItem('arco-contradiction-today')||'null'); }catch(e){}
  let pick = (rec && rec.date===today) ? fired.find(r=>r.id===rec.id) : null;
  if(!pick){
    pick = selectDaily(fired, shown) || selectDaily(fired, []) || fired[0];
    shown = [...new Set([...shown, pick.id])];
    try{ localStorage.setItem('arco-contradictions-shown', JSON.stringify(shown)); }catch(e){}
    try{ localStorage.setItem('arco-contradiction-today', JSON.stringify({date:today, id:pick.id})); }catch(e){}
  }
  return `<div style="background:var(--card);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;">${contradictionInner(pick)}</div>`;
}

function weekPlanCard(){
  let plan; try{ plan = planWeek(profile); }catch(e){ return ''; }
  if(!plan || !plan.days || plan.days.length < 2) return '';
  const cols = plan.days.map((d,i)=>{
    const hedged = i >= 3;                                   // days 4-7 recede
    const sug = d.suggestion==='rest' ? 'rest' : (d.outside ? 'outside' : 'train');
    const sugColor = sug==='rest' ? 'var(--muted)' : sug==='outside' ? 'var(--orange)' : 'var(--ink)';
    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;${hedged?'opacity:0.5;':''}">
      <div style="font-size:9.5px;letter-spacing:0.05em;color:var(--muted);text-transform:uppercase;">${d.name}</div>
      <div style="height:15px;line-height:0;">${_wxGlyph(d)}</div>
      <div style="font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;">${d.tmax!=null?Math.round(d.tmax)+'°':'&nbsp;'}</div>
      <div style="font-size:9.5px;font-weight:600;color:${sugColor};letter-spacing:0.01em;">${sug}</div>
    </div>`;
  }).join('');
  const flags = [];
  if(plan.lastWarmDay){ const d=plan.lastWarmDay; flags.push(`Last day above 15°C ${d.i>=3?'looks to be':'is'} ${d.name}.`); }
  if(plan.sunsetBeforeTraining){ const d=plan.sunsetBeforeTraining; flags.push(`Sunset ${d.i>=3?'looks to fall':'falls'} before your usual training time from ${d.name}.`); }
  const flagHtml = flags.length ? `<div style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--sep);">${flags.join('<br>')}</div>` : '';
  return `<div style="background:var(--card);border-radius:var(--radius);padding:16px 14px 14px;margin-bottom:12px;">
    <div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;">the week ahead</div>
    <div style="display:flex;gap:3px;">${cols}</div>
    ${flagHtml}
    <div style="font-size:10px;color:var(--muted);opacity:0.75;margin-top:10px;">forecasts beyond 4 days are less reliable</div>
  </div>`;
}

window.openCheckin = function(){
  currentQuestion = getNextQuestion();
  currentQAnswer = null;
  const q = currentQuestion;
  document.getElementById('ci-question-title').textContent = q.title;
  document.getElementById('ci-question-sub').textContent = q.sub || '';
  const btn = document.getElementById('ci-action-btn');
  btn.textContent = 'log it →'; btn.setAttribute('onclick','submitCheckin()');
  let body = '';
  if(q.type === 'time'){
    body = `<input class="field-input" id="ci-time" type="time" style="text-align:center;font-size:22px;" oninput="currentQAnswer=this.value">`;
  } else if(q.type === 'slider'){
    body = `<div class="slider-wrap" style="margin-top:8px;"><div class="slider-row"><input type="range" min="${q.min}" max="${q.max}" value="${q.default}" step="1" id="ci-slider" oninput="currentQAnswer=this.value;document.getElementById('ci-sv').textContent=this.value"><span class="slider-val" id="ci-sv">${q.default}</span></div><div class="slider-labels"><span>${q.labels[0]}</span><span>${q.labels[1]}</span></div></div>`;
    currentQAnswer = String(q.default);
  } else {
    body = `<div id="ci-chips"><div class="chip-group" style="margin-top:8px;">${q.options.map((opt,i)=>`<div class="chip" data-val="${q.vals[i]}" onclick="currentQAnswer='${q.vals[i]}';document.querySelectorAll('#ci-chips .chip').forEach(c=>c.classList.remove('sel-ink'));this.classList.add('sel-ink');">${opt}</div>`).join('')}</div></div>`;
  }
  document.getElementById('ci-question-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('checkin-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeCheckin = function(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('checkin-modal').classList.remove('open');
  document.body.style.overflow = '';
};

window.submitCheckin = function(){
  const q = currentQuestion;
  if(currentQAnswer==null || currentQAnswer==='') currentQAnswer = q.vals ? q.vals[0] : (q.default!=null?String(q.default):'');
  // Snapshot which contradictions are already firing, to detect a newly-unlocked one.
  let before=[]; try{ before = runContradictions(toContradictionProfile(profile)).fired.map(r=>r.id); }catch(e){}
  // Store the typed value onto the profile.
  profile[q.field] = q.toProfile ? q.toProfile(currentQAnswer) : currentQAnswer;
  try{ localStorage.setItem('arco-profile',JSON.stringify(profile)); }catch(e){}
  saveProfileRemote();
  // Keep writing answers to daily_logs (+ local checkins for the streak).
  const today = new Date().toDateString();
  if(!checkins.find(c=>c.date===today && c.key===q.field)){
    checkins.push({date:today, key:q.field, value:String(currentQAnswer)});
    try{ localStorage.setItem('arco-checkins',JSON.stringify(checkins)); }catch(e){}
  }
  saveCheckinRemote(q.field, String(currentQAnswer));
  // Immediate payout: if that answer unlocked a new contradiction, show it right now.
  let after=[]; try{ after = runContradictions(toContradictionProfile(profile)).fired; }catch(e){}
  const unlocked = after.find(r => !before.includes(r.id));
  if(unlocked){ revealContradiction(unlocked); }
  else { closeCheckin(); buildDash(); }
};

// Reveal a freshly-unlocked contradiction inside the check-in sheet.

}

function buildWeekRow(){
  const today=new Date();
  const todayStr=today.toDateString();
  const dates=new Set(checkins.map(c=>c.date));
  const dayNames=['M','T','W','T','F','S','S'];
  // Find Monday of current week
  const monday=new Date(today);
  const dayOfWeek=today.getDay(); // 0=Sun, 1=Mon...
  const daysFromMonday=(dayOfWeek+6)%7; // Mon=0, Tue=1...Sun=6
  monday.setDate(today.getDate()-daysFromMonday);
  let html='<div class="week-row">';
  for(let i=0;i<7;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    const ds=d.toDateString();
    const isToday=ds===todayStr;
    const done=dates.has(ds);
    const isFuture=d>today&&!isToday;
    const ch=dayNames[i];
    let cls='week-dot empty',inner='';
    if(isToday&&done){cls='week-dot wtoday';inner=`<span style="font-size:11px;color:#fff;font-weight:600;">${ch}</span>`;}
    else if(isToday){cls='week-dot wtoday';inner=`<span style="font-size:11px;color:#fff;font-weight:500;">${ch}</span>`;}
    else if(done){cls='week-dot done';inner=`<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="#EDE9E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
    else if(isFuture){cls='week-dot empty';inner='';}
    html+=`<div class="week-day"><div class="${cls}">${inner}</div><div class="week-dot-label${isToday?' wtoday':''}" style="${isFuture?'opacity:0.3;':''}">${ch}</div></div>`;
  }
  return html+'</div>';
}

    name: s.name,
    dose: s.elemental_dose,
    window: s.timing_window,
    reason: s.timing_reason,
    evidence: s.evidence_grade,
    best_form: s.best_form,

// ── PERSONALISED DOSE WINDOWS ──────────────────────────────────────────────
// The KB timing_window values are fixed clock hours (they document the
// pharmacology). This layer maps each supplement's intent onto the user's own
// wake/bed so a late riser never sees a 6am dose, with a hard floor: nothing
// before wake, nothing after bed. Timing-independent supplements (creatine) are
// flagged 'anytime' and rendered outside the timed protocol — showing them in a
// slot would imply a precision the evidence does not support.
const ANYTIME_SUPS = new Set(['creatine']);
function supBucket(key){
  if(ANYTIME_SUPS.has(key)) return 'anytime';
  const w = SUPPLEMENTS[key] && SUPPLEMENTS[key].window;
  if(!w) return 'morning';
  const mid = (w[0] + w[1]) / 2;
  if(mid >= 17) return 'evening';
  if(mid >= 11) return 'midday';
  return 'morning';
}
function personalizeWindow(key, p){
  p = p || profile;
  if(supBucket(key) === 'anytime') return null;                 // no timed slot
  const wake = (p.wakeTime ?? p.wake ?? 7), bed = (p.bedTime ?? p.bed ?? 23);
  let start, end;
  switch(supBucket(key)){
    case 'evening':
      if(key === 'zinc'){ start = bed - 3; end = bed - 1; }      // earlier, off the pre-bed magnesium
      else { start = bed - 2; end = bed - 0.5; }                 // pre-bed group hugs bedtime
      break;
    case 'midday': start = wake + 4; end = wake + 6; break;
    default:       start = wake + 0.5; end = wake + 2.5;         // morning
  }
  // Floor: clamp into the waking day; keep at least a 30-minute slot.
  start = Math.max(start, wake); end = Math.min(end, bed);
  if(end <= start){ start = Math.max(wake, Math.min(start, bed - 0.5)); end = Math.min(bed, start + 0.5); }
  const q = n => Math.round(n * 4) / 4;                          // snap to 15 min
  return [q(start), q(end)];
}
// A render-ready supplement: KB data with its window personalised and an anytime flag.
function supView(key, p){
  const s = SUPPLEMENTS[key]; if(!s) return null;
  const pw = personalizeWindow(key, p || profile);
  return Object.assign({key}, s, {window: pw || s.window, anytime: pw === null});
}

/* ============================================================================
   ARCO — CONTRADICTION ENGINE v1  (inlined per single-file rule; see schema
   in the header comment below). Wired to existing profile fields only via
   toContradictionProfile(); rules needing uncollected fields self-skip.
   ============================================================================ */

const has = (arr, x) => Array.isArray(arr) && arr.includes(x);

// Hours between two 24h decimal times, handling midnight wraparound.
const hoursUntil = (from, to) => (to >= from ? to - from : 24 - from + to);

// Northern-hemisphere month check for high-latitude vitamin D window.
const isDarkMonths = (d = new Date()) => [9, 10, 11, 0, 1, 2].includes(d.getMonth());

const sleepDuration = (p) =>
  p.sleepHours != null
    ? p.sleepHours
    : (p.bedTime != null && p.wakeTime != null ? hoursUntil(p.bedTime, p.wakeTime) : null);

// ── CHRONOTYPE (Munich ChronoType Questionnaire method; Roenneberg) ──────────
// Two data points are a proxy, not a measurement, so everything downstream stays
// "roughly". All arithmetic wraps around midnight (a 01:00 bedtime is 1.0, not 25.0).
const norm24 = x => ((x % 24) + 24) % 24;
// Signed shortest circular difference a-b, in (-12, 12].
const circDiff = (a, b) => { let d = (a - b) % 24; if (d > 12) d -= 24; if (d <= -12) d += 24; return d; };
function computeChronotype(p){
  const bedTime = p.bedTime ?? p.bed, wakeTime = p.wakeTime ?? p.wake;
  const wkBed = p.weekendBedTime, wkWake = p.weekendWakeTime;
  if(bedTime == null || wakeTime == null || wkBed == null || wkWake == null) return null;
  const SDw = hoursUntil(bedTime, wakeTime);        // work-day sleep duration (wraps)
  const SDf = hoursUntil(wkBed, wkWake);            // free-day sleep duration (wraps)
  const MSW = norm24(bedTime + SDw / 2);
  const MSF = norm24(wkBed + SDf / 2);
  // Sleep-corrected mid-sleep: people oversleep on free days to repay weekday debt,
  // which pushes MSF later than their true chronotype. Remove it. Skip when they
  // sleep LESS on free days (correction would be meaningless) — a low-confidence read.
  const sleepsLessFree = SDf < SDw;
  const MSFsc = SDf > SDw ? norm24(MSF - 0.5 * (SDf - SDw)) : MSF;
  const socialJetlag = Math.abs(circDiff(MSF, MSW));
  // Biological window: their own free-day duration, centred on MSFsc.
  const bioBedTime = norm24(MSFsc - SDf / 2);
  const bioWakeTime = norm24(MSFsc + SDf / 2);
  const bedGap = circDiff(bioBedTime, bedTime);     // + earlier than bio, - too late
  const wakeGap = circDiff(bioWakeTime, wakeTime);  // + they wake too early
  const noVariation = Math.abs(circDiff(MSF, MSW)) < 0.25 && Math.abs(SDf - SDw) < 0.25;
  return { SDw, SDf, MSW, MSF, MSFsc, socialJetlag, bioBedTime, bioWakeTime, bedTime, wakeTime,
           bedGap, wakeGap, lowConfidence: sleepsLessFree || noVariation, noVariation };
}
// Spectrum descriptor from MSFsc — never rendered as a bare category, always with the time.
function chronotypeDescriptor(msfsc){
  return msfsc < 2.5 ? 'early' : msfsc < 3.5 ? 'moderately early' : msfsc < 4.5 ? 'intermediate'
    : msfsc < 5.5 ? 'moderately late' : 'late';
}

const EVIDENCE_WEIGHT = {
  'STRONG': 1.0,
  'MODERATE-STRONG': 0.85,
  'MODERATE': 0.7,
  'WEAK': 0.35
};

const evidenceWeight = (grade) => {
  const key = Object.keys(EVIDENCE_WEIGHT).find(k => String(grade).startsWith(k));
  return EVIDENCE_WEIGHT[key] ?? 0.5;
};

// Fill {token} placeholders in a fired rule's copy from the profile plus any
// computed values() the rule supplies. Rules without tokens pass through untouched.
function interpolateRule(rule, p) {
  const hasTokens = /\{\w+\}/.test((rule.contradiction||'') + (rule.mechanism||''));
  if (!hasTokens && !rule.values) return rule;
  const vals = Object.assign({}, p, rule.values ? rule.values(p) : {});
  const fill = s => typeof s === 'string'
    ? s.replace(/\{(\w+)\}/g, (m,k) => vals[k] != null ? String(vals[k]) : m) : s;
  return Object.assign({}, rule, {
    contradiction: fill(rule.contradiction),
    mechanism: fill(rule.mechanism),
    fixes: rule.fixes.map(f => Object.assign({}, f, { action: fill(f.action) }))
  });
}

function runContradictions(profile) {
  const fired = [];
  const skipped = [];
  for (const rule of RULES) {
    const missing = rule.requires.filter(f => profile[f] === undefined || profile[f] === null);
    if (missing.length) {
      skipped.push({ id: rule.id, missing });
      continue;
    }
    try {
      if (rule.fires(profile)) fired.push(interpolateRule(rule, profile));
    } catch (err) {
      console.error(`[arco] rule ${rule.id} threw`, err);
    }
  }
  return { fired: rank(fired), skipped };
}

function rank(fired) {
  return fired
    .map(r => ({
      ...r,
      score: (r.importance ?? 0) >= 9
        ? 100
        : (r.surprise ?? 5) * evidenceWeight(r.evidence)
    }))
    .sort((a, b) => b.score - a.score);
}

function selectDaily(fired, alreadyShownIds = []) {
  return fired.find(r => !alreadyShownIds.includes(r.id)) ?? null;
}

function nextBestQuestions(profile, limit = 5) {
  const counts = {};
  for (const rule of RULES) {
    for (const field of rule.requires) {
      if (profile[field] === undefined || profile[field] === null) {
        counts[field] = (counts[field] ?? 0) + 1;
      }
    }
  }
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([field, unlocks]) => ({ field, unlocks }));
}

/* ── FIELD MAPPING: our stored profile → the engine's schema. Existing fields
   only; anything we don't collect is left absent so runContradictions skips
   the rules that need it (never guessed). See the mapping report for details. */
function toContradictionProfile(p){
  const trainingDaysMap = {'1-2':2, '3-4':4, '5+':5};                 // range → representative count
  const trainingTimeMap = {morning:7, afternoon:14, evening:20};       // string → 24h decimal
  const meatMap = {omnivore:'moderate', low_meat:'low', vegetarian:'none', vegan:'none'};
  const fishMap = {'2plus':'2plus', sometimes:'occasionally', never:'never'};
  const sunlightMap = {always:'often', sometimes:'sometimes', rarely:'rarely'};
  const alcoholMap = {none:0, low:2, moderate:5, high:7};              // chip → drinks/week midpoint
  const medMap = {statins:'statin'};                                   // engine expects singular
  const stackMap = {vitd:'vitaminD'};                                  // engine expects 'vitaminD'
  const e = {};
  if(p.sex!=null) e.sex = p.sex;
  if(p.stress!=null) e.stress = p.stress;
  if(p.latBand!=null) e.latBand = p.latBand;
  if(p.trainingFreq!=null && trainingDaysMap[p.trainingFreq]!=null) e.trainingDays = trainingDaysMap[p.trainingFreq];
  if(p.trainingTime!=null && trainingTimeMap[p.trainingTime]!=null) e.trainingTime = trainingTimeMap[p.trainingTime];
  if(p.diet!=null && meatMap[p.diet]!=null) e.meat = meatMap[p.diet];
  if(p.fish!=null) e.fish = fishMap[p.fish] ?? p.fish;
  if(p.sunlight!=null) e.sunlight = sunlightMap[p.sunlight] ?? p.sunlight;
  if(p.alcohol!=null && alcoholMap[p.alcohol]!=null) e.alcoholDrinksPerWeek = alcoholMap[p.alcohol];
  if(Array.isArray(p.meds)) e.meds = p.meds.map(m => medMap[m] ?? m);
  if(Array.isArray(p.currentStack)) e.currentStack = p.currentStack.map(s => stackMap[s] ?? s);
  // Fallback: the legacy sleep-step fields feed the engine's wakeTime/bedTime.
  if(e.wakeTime==null && p.wake!=null) e.wakeTime = p.wake;
  if(e.bedTime==null && p.bed!=null) e.bedTime = p.bed;
  // Direct pass-throughs once collected (added by later onboarding steps):
  ['wakeTime','bedTime','lastCoffeeTime','weekendWakeTime','weekendBedTime','magnesiumForm','morningLight',
   'screensBeforeBed','proteinBreakfast','eatingWindowEnd','commuteMode','commuteMinutes',
   'sitLongestBlock','sleepLatency','nightWakings','alcoholTiming','coffeeCups','sleepHours',
   'antihistamineGen','workStart','workEnd',
   // location + live weather (populated by loadWeather):
   'city','uvToday','sunriseToday','sunsetToday','daylightMinutes','daylightDeltaMin',
   'no2','no2Peak','no2Baseline','pollenHigh','forecast'
  ].forEach(f => { if(p[f]!=null) e[f]=p[f]; });
  return e;
}

if (typeof module !== 'undefined') {
  module.exports = { RULES, runContradictions, selectDaily, nextBestQuestions, rank };
}

function drawCurve(h){
  const canvas=document.getElementById('main-curve');if(!canvas)return;
  const w=canvas.width,ch=canvas.height,ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,ch);
  [{key:'cortisol',color:'#E8520A'},{key:'melatonin',color:'#7B8FE8'},{key:'testosterone',color:'#4BB87B'}].forEach(({key,color})=>{
    ctx.beginPath();
    for(let i=0;i<=240;i++){
      const hh=(i/240)*24,v=getHormones(hh,profile,todayMod)[key],x=(hh/24)*w,y=ch-4-v*(ch-8);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
  });
  const cx=(h/24)*w;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,ch);
  ctx.strokeStyle='rgba(26,22,18,0.2)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);
}

// ── SUPABASE AUTH + SYNC ──
// Flow: not logged in → login screen. Logged in + profile → dashboard.
// Logged in, no profile → onboarding → diagnosis → dashboard.
// localStorage stays the offline cache; every action writes to both.
let currentUser = null;

// Local calendar date as YYYY-MM-DD for the `date` columns
function isoDate(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ── EMAIL OTP (6-digit code) ──
// Magic links can't work in an iOS home-screen PWA — it has its own storage container
// separate from Safari, so the link opens in Safari and the session lands in the wrong place.
// A code the user types stays inside the PWA. Requires the Supabase "Magic Link" email
// template to surface {{ .Token }}. Prefix-scoped so the onboarding "sign in" screen
// (prefix 'login') and the diagnosis "save your protocol" card (prefix 'save') share it.
const _otpEmail = {};
let _resendTimer = null;

function _otpEl(prefix, suffix){ return document.getElementById(prefix + '-' + suffix); }
function _setNote(el, text, kind){ // kind: 'muted' | 'error' | 'ok'
  if(!el) return;
  el.textContent = text || ' ';
  el.style.opacity = '1';
  el.style.color = kind==='error' ? 'var(--orange)' : kind==='ok' ? '#4BB87B' : ''; // '' → CSS default (theme-aware)
}

// Stage 1 → send the code
window.sendCode = async function(prefix){
  const input = _otpEl(prefix,'email'), note = _otpEl(prefix,'email-note'), btn = _otpEl(prefix,'email-btn');
  const email = (input.value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ _setNote(note, 'enter a valid email address', 'error'); return; }
  btn.disabled = true; _setNote(note, 'sending code...', 'muted');
  const {error} = await _supabase.auth.signInWithOtp({email, options:{shouldCreateUser:true}});
  btn.disabled = false;
  if(error){ _setNote(note, error.message || 'something went wrong, try again', 'error'); return; }
  _otpEmail[prefix] = email;
  _otpEl(prefix,'code-email').textContent = email;
  _otpEl(prefix,'email-stage').style.display = 'none';
  _otpEl(prefix,'code-stage').style.display = 'flex';
  const code = _otpEl(prefix,'code');
  code.value = ''; code.classList.remove(prefix+'-input-error');
  _otpEl(prefix,'code-note').style.opacity = '0';
  startResendCooldown(prefix);
  setTimeout(()=>code.focus(), 60);
};

// Keep only digits; auto-submit at 6
window.onCodeInput = function(el, prefix){
  el.value = el.value.replace(/\D/g,'').slice(0,6);
  el.classList.remove(prefix+'-input-error');
  _otpEl(prefix,'code-note').style.opacity = '0';
  if(el.value.length === 6) verifyCode(prefix);
};

// Stage 2 → verify the code. On success, onAuthStateChange('SIGNED_IN') → routeUser handles
// routing (saves the locally-stored profile to Supabase if there isn't one yet, then dashboard).
window.verifyCode = async function(prefix){
  const input = _otpEl(prefix,'code'), note = _otpEl(prefix,'code-note');
  const code = (input.value||'').trim();
  if(code.length !== 6) return;
  input.disabled = true; _setNote(note, 'verifying...', 'muted');
  const {error} = await _supabase.auth.verifyOtp({email:_otpEmail[prefix], token:code, type:'email'});
  if(error){
    input.disabled = false;
    input.classList.add(prefix+'-input-error');
    _setNote(note, 'incorrect code, try again', 'error');
    input.value = ''; setTimeout(()=>input.focus(), 40);
    return;
  }
  _setNote(note, 'signing you in...', 'ok');
};

window.backToEmail = function(prefix){
  clearInterval(_resendTimer);
  _otpEl(prefix,'code-stage').style.display = 'none';
  _otpEl(prefix,'email-stage').style.display = 'flex';
  _setNote(_otpEl(prefix,'email-note'), prefix==='login' ? 'enter your email to sign in' : '', 'muted');
  setTimeout(()=>_otpEl(prefix,'email').focus(), 40);
};

window.resendCode = async function(prefix){
  const btn = _otpEl(prefix,'resend');
  if(btn.dataset.cd === '1') return; // still in cooldown
  const note = _otpEl(prefix,'code-note');
  const {error} = await _supabase.auth.signInWithOtp({email:_otpEmail[prefix], options:{shouldCreateUser:true}});
  if(error){ _setNote(note, error.message || 'could not resend, try again', 'error'); return; }
  _setNote(note, 'new code sent', 'muted');
  startResendCooldown(prefix);
};

// 30-second resend cooldown
function startResendCooldown(prefix){
  const btn = _otpEl(prefix,'resend');
  btn.dataset.cd = '1';
  btn.style.opacity = '0.4'; btn.style.textDecoration = 'none'; btn.style.cursor = 'default';
  let s = 30;
  btn.textContent = 'resend code in ' + s + 's';
  clearInterval(_resendTimer);
  _resendTimer = setInterval(()=>{
    s--;
    if(s <= 0){
      clearInterval(_resendTimer);
      btn.dataset.cd = '0'; btn.textContent = 'resend code';
      btn.style.opacity = ''; btn.style.textDecoration = ''; btn.style.cursor = '';
    } else {
      btn.textContent = 'resend code in ' + s + 's';
    }
  }, 1000);
}
window.arcoSignOut = function(){
  try{localStorage.clear();}catch(e){}
  _supabase.auth.signOut().finally(()=>location.reload());
};

// ── REMOTE WRITES (fire-and-forget; never block the UI) ──
async function saveProfileRemote(){
  if(!currentUser) return;
  try{
    // Columns match the live schema: users(id, email, name, profile jsonb, supplements)
    await _supabase.from('users').upsert({
      id: currentUser.id,
      email: currentUser.email,
      name: profile.name,
      profile: profile,
      supplements: profile.supplements || []
    });
  }catch(e){console.warn('[arco] profile sync failed', e);}
}
async function saveTakenRemote(key, taken){
  if(!currentUser) return;
  const d = isoDate();
  try{
    // supplement_taken(user_id, supplement_key, date, taken_at, count) — a row means taken.
    await _supabase.from('supplement_taken').delete().eq('user_id',currentUser.id).eq('supplement_key',key).eq('date',d);
    if(taken){
      await _supabase.from('supplement_taken').insert({user_id:currentUser.id, supplement_key:key, date:d, taken_at:new Date().toISOString(), count:1});
    }
  }catch(e){console.warn('[arco] taken sync failed', e);}
}
async function saveCheckinRemote(questionKey, answer){
  if(!currentUser) return;
  const d = isoDate();
  try{
    // daily_logs(user_id, date, question_key, answer) — one row per day; replace on re-check-in.
    await _supabase.from('daily_logs').delete().eq('user_id',currentUser.id).eq('date',d);
    await _supabase.from('daily_logs').insert({user_id:currentUser.id, date:d, question_key:questionKey, answer:String(answer)});
  }catch(e){console.warn('[arco] checkin sync failed', e);}
}

// ── REMOTE READS (hydrate the local caches on load) ──
// Returns the stored profile, null if the user has no row, or undefined on a fetch error.
async function loadProfileRemote(){
  if(!currentUser) return null;
  try{
    const {data, error} = await _supabase.from('users').select('profile').eq('id', currentUser.id).maybeSingle();
    if(error) throw error;
    return data ? data.profile : null;
  }catch(e){console.warn('[arco] profile load failed', e); return undefined;}
}
async function hydrateFromRemote(){
  if(!currentUser) return;
  try{
    // A supplement_taken row for today = that supplement was taken.
    const {data:takenRows} = await _supabase.from('supplement_taken').select('supplement_key').eq('user_id',currentUser.id).eq('date',isoDate());
    if(takenRows){
      takenToday.length=0;
      takenRows.forEach(r=>takenToday.push(r.supplement_key));
      try{localStorage.setItem('arco-taken-'+new Date().toDateString(),JSON.stringify(takenToday));}catch(e){}
    }
  }catch(e){console.warn('[arco] taken load failed', e);}
  try{
    const {data:logRows} = await _supabase.from('daily_logs').select('date,question_key,answer').eq('user_id',currentUser.id).order('date',{ascending:true});
    if(logRows){
      // Rebuild local checkins ({date,key,value}); parse date as local to match toDateString() usage.
      checkins = logRows.map(r=>{const p=(r.date||'').split('-').map(Number); return {date:new Date(p[0],p[1]-1,p[2]).toDateString(), key:r.question_key, value:r.answer};});
      try{localStorage.setItem('arco-checkins',JSON.stringify(checkins));}catch(e){}
    }
  }catch(e){console.warn('[arco] logs load failed', e);}
}

// ── ROUTING ──
let _routing = false;
function startOnboarding(){ currentStep = 0; showScreen('screen-onboard'); renderStep(); }

async function routeUser(session){
  if(_routing) return;
  _routing = true;
  try{
    if(!session){
      // No session → straight to onboarding (runs fine from localStorage). Auth happens later,
      // on the diagnosis "save your protocol" card, or via the onboarding "sign in" link.
      currentUser = null;
      startOnboarding();
      return;
    }
    currentUser = session.user;
    const remoteProfile = await loadProfileRemote();
    const localProfile = JSON.parse(localStorage.getItem('arco-profile')||'null');
    if(remoteProfile && remoteProfile.supplements && remoteProfile.supplements.length){
      // Returning user (incl. sign-in on a new device) → load the saved profile → dashboard.
      profile = remoteProfile;
      if(!profile.name || profile.name==='you') profile.name = (currentUser.email||'you').split('@')[0];
      try{localStorage.setItem('arco-profile',JSON.stringify(profile));}catch(e){}
      await hydrateFromRemote();
      showDash();
    } else if(localProfile && localProfile.supplements && localProfile.supplements.length){
      // Just signed in from the diagnosis "save" card (remoteProfile null, or a fetch error) →
      // persist the locally-built profile to Supabase, then go to the dashboard.
      profile = localProfile;
      if(!profile.name || profile.name==='you') profile.name = (currentUser.email||'you').split('@')[0];
      await saveProfileRemote();
      showDash();
    } else {
      // Signed in but nothing saved anywhere → onboarding.
      startOnboarding();
    }
  } finally { _routing = false; }
}

// Render onboarding immediately so there's no blank flash while auth resolves.
renderStep();
// Initial session check, then react to future auth changes.
_supabase.auth.getSession().then(({data:{session}})=>routeUser(session));
_supabase.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_IN') routeUser(session);
  else if(event==='SIGNED_OUT'){ currentUser=null; startOnboarding(); }
});
</script>
