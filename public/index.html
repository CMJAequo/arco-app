<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arco</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arco">
  <meta name="theme-color" content="#EDE9E1">
  <link href="https://fonts.googleapis.com/css2?family=Switzer:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#EDE9E1;
  --card:#E4DED5;
  --card-peach:#F5C4A0;
  --ink:#1A1612;
  --orange:#E8520A;
  --orange-track:#F2C9B0;
  --muted:rgba(26,22,18,0.42);
  --sep:rgba(26,22,18,0.1);
  --radius:20px;
  --font:'Switzer',sans-serif;
}
body{font-family:var(--font);background:#d4cfc7;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0;}
.phone{width:390px;min-height:844px;background:var(--bg);border-radius:44px;overflow:visible;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.35);}
.screen{display:none;flex-direction:column;min-height:844px;overflow:visible;}
.screen.active{display:flex;}

/* STANDALONE PWA — edge to edge when launched from home screen */
@media (display-mode: standalone){
  body{background:#EDE9E1;padding:0;}
  .phone{width:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top);}
  .modal-sheet{width:100%;}
}

/* ONBOARDING */
.ob-header{background:var(--ink);padding:10px 24px 28px;}
.ob-logo{color:#EDE9E1;font-size:26px;font-weight:300;letter-spacing:-0.02em;}
.ob-sub{color:#EDE9E1;font-size:10px;opacity:0.38;letter-spacing:0.08em;margin-top:3px;}
.ob-body{flex:1;padding:28px 24px 32px;display:flex;flex-direction:column;overflow-y:auto;}
.step-bar{display:flex;gap:6px;margin-bottom:28px;}
.step-dot{height:3px;flex:1;border-radius:2px;background:rgba(26,22,18,0.1);transition:background 0.3s;}
.step-dot.done{background:var(--orange);}
.step-dot.active{background:var(--ink);}
.step-title{font-size:22px;font-weight:400;color:var(--ink);letter-spacing:-0.02em;line-height:1.25;margin-bottom:6px;}
.step-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:28px;}
.field-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;}
.field-input,.field-select{width:100%;background:var(--card);border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-family:var(--font);color:var(--ink);outline:none;margin-bottom:16px;transition:box-shadow 0.2s;-webkit-appearance:none;}
.field-input:focus,.field-select:focus{box-shadow:0 0 0 2px var(--orange);}
.city-dd{position:absolute;top:calc(100% - 8px);left:0;right:0;background:var(--card);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,0.18);overflow:hidden;z-index:40;}
.city-opt{display:flex;align-items:baseline;gap:8px;padding:12px 16px;cursor:pointer;border-bottom:0.5px solid var(--sep);}
.city-opt:last-child{border-bottom:none;}
.city-opt:hover,.city-opt:active{background:rgba(0,0,0,0.05);}
.city-opt-name{font-size:15px;color:var(--ink);}
.city-opt-sub{font-size:12px;color:var(--muted);}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.chip{padding:9px 16px;border-radius:24px;font-size:13px;font-family:var(--font);background:var(--card);color:var(--ink);border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;}
.chip.sel-ink{background:var(--ink);color:#EDE9E1;}
.chip.sel-orange{background:var(--orange);color:#fff;border-color:var(--orange);}
.slider-wrap{margin-bottom:4px;}
.slider-row{display:flex;align-items:center;gap:12px;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--card);outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;}
.slider-val{font-size:13px;font-weight:500;color:var(--orange);min-width:20px;text-align:right;}
.slider-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;margin-bottom:16px;}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity 0.15s;margin-top:auto;}
.btn-ink{background:var(--ink);color:#EDE9E1;}
.btn-orange{background:var(--orange);color:#fff;}
.btn:hover{opacity:0.88;}

/* LOADING */
.loading-wrap{flex:1;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.loading-logo{color:#EDE9E1;font-size:36px;font-weight:300;letter-spacing:-0.03em;}
.loading-tag{color:#EDE9E1;font-size:11px;opacity:0.35;letter-spacing:0.08em;margin-top:6px;margin-bottom:48px;}
.loading-track{width:130px;height:2px;background:rgba(237,233,225,0.12);border-radius:1px;overflow:hidden;}
.loading-fill{height:100%;background:var(--orange);border-radius:1px;width:0%;transition:width 0.08s linear;}
.loading-msg{color:#EDE9E1;font-size:12px;opacity:0.35;margin-top:14px;letter-spacing:0.04em;}

/* LOGIN */
.login-wrap{flex:1;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 32px;}
.login-logo{color:#EDE9E1;font-size:44px;font-weight:300;letter-spacing:-0.03em;line-height:1;}
.login-tag{color:#EDE9E1;font-size:11px;opacity:0.35;letter-spacing:0.08em;margin-top:8px;margin-bottom:52px;}
.login-input{width:100%;padding:15px 18px;border:1px solid rgba(237,233,225,0.15);border-radius:14px;background:rgba(237,233,225,0.06);color:#EDE9E1;font-size:15px;font-family:var(--font);outline:none;text-align:center;margin-bottom:12px;transition:border-color 0.15s;-webkit-appearance:none;}
.login-input::placeholder{color:rgba(237,233,225,0.3);}
.login-input:focus{border-color:var(--orange);}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 20px;border:none;border-radius:14px;background:var(--orange);color:#fff;font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity 0.15s;}
.login-btn:hover{opacity:0.9;}
.login-note{color:#EDE9E1;opacity:0.3;font-size:11px;letter-spacing:0.06em;margin-top:20px;text-align:center;}
.login-sent-title{color:#EDE9E1;font-size:20px;font-weight:400;letter-spacing:-0.01em;margin-bottom:10px;}
.login-sent-sub{color:#EDE9E1;opacity:0.45;font-size:13px;line-height:1.6;margin-bottom:24px;}
.login-link{background:none;border:none;color:#EDE9E1;opacity:0.4;font-size:12px;font-family:var(--font);letter-spacing:0.04em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.login-code-input{font-size:26px;letter-spacing:8px;font-weight:500;text-align:center;text-indent:8px;caret-color:var(--orange);}
.login-input-error,.login-input-error:focus{border-color:#cc3333;}
.login-back{align-self:flex-start;background:none;border:none;color:#EDE9E1;opacity:0.4;font-size:12px;font-family:var(--font);letter-spacing:0.03em;cursor:pointer;margin-bottom:24px;padding:0;}
.login-btn:disabled{opacity:0.55;cursor:default;}
/* onboarding sign-in link + save-your-protocol card (light theme, on the cream diagnosis card) */
.ob-signin{background:none;border:none;color:var(--orange);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
.ob-back{align-self:flex-start;background:none;border:none;color:var(--muted);font-size:12px;font-family:var(--font);letter-spacing:0.03em;cursor:pointer;margin-bottom:16px;padding:0;}
.save-input{width:100%;padding:14px 16px;border:1px solid var(--sep);border-radius:12px;background:var(--bg);color:var(--ink);font-size:15px;font-family:var(--font);outline:none;text-align:center;margin-bottom:10px;transition:border-color 0.15s;-webkit-appearance:none;}
.save-input::placeholder{color:var(--muted);}
.save-input:focus{border-color:var(--orange);}
.save-code-input{font-size:24px;letter-spacing:8px;font-weight:500;text-indent:8px;}
.save-input-error,.save-input-error:focus{border-color:#cc3333;}
.save-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:#EDE9E1;font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity 0.15s;}
.save-btn:hover{opacity:0.9;}
.save-btn:disabled{opacity:0.55;cursor:default;}
.save-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;min-height:14px;letter-spacing:0.03em;}
.save-back{align-self:flex-start;background:none;border:none;color:var(--muted);font-size:12px;font-family:var(--font);cursor:pointer;margin-bottom:14px;padding:0;}
.save-resend{background:none;border:none;color:var(--muted);font-size:12px;font-family:var(--font);cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:12px;}

/* DASHBOARD TOP BAR */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;background:var(--bg);}
.topbar-streak{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:20px;padding:6px 12px;}
.topbar-streak-count{color:var(--ink);font-size:12px;font-weight:500;}
.topbar-streak-label{color:var(--ink);font-size:12px;font-weight:500;}
.topbar-grid{display:flex;gap:3px;flex-wrap:wrap;width:18px;}
.topbar-grid span{width:7px;height:7px;background:var(--ink);border-radius:1px;display:block;opacity:0.5;}
.topbar-today{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:20px;padding:6px 12px;}
.topbar-today-label{font-size:12px;color:var(--ink);font-weight:500;}
.topbar-today-arrow{font-size:10px;color:var(--muted);}

/* DASH BODY */
.dash-body{flex:1;padding:0 16px;overflow-y:auto;padding-bottom:90px;}

/* ARC SCORE CARD */
.arc-card{background:var(--card);border-radius:var(--radius);padding:20px 20px 16px;margin-bottom:12px;}
.arc-label{font-size:10px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase;text-align:center;margin-bottom:16px;}
.arc-ring-wrap{display:flex;justify-content:center;margin-bottom:16px;}
.arc-divider{height:0.5px;background:var(--sep);margin:0 -4px 14px;}
.arc-stats{display:grid;grid-template-columns:repeat(3,1fr);}
.arc-stat{text-align:center;padding:0 8px;}
.arc-stat + .arc-stat{border-left:0.5px solid var(--sep);}
.arc-stat-label{font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.arc-stat-val{font-size:22px;font-weight:600;color:var(--ink);line-height:1;}
.arc-stat-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.arc-caption{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}

/* INSIGHT CARD */
.insight-card{background:var(--card-peach);border-radius:16px;padding:14px 16px;margin-bottom:12px;border-left:3px solid var(--orange);}
.insight-label{font-size:10px;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.insight-text{font-size:13px;color:var(--ink);line-height:1.6;}

/* NOW WINDOW CARD */
.now-card{background:var(--ink);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;}
.now-window-label{font-size:10px;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.now-window-time{font-size:22px;font-weight:500;color:#EDE9E1;letter-spacing:-0.01em;margin-bottom:6px;}
.now-window-desc{font-size:13px;color:rgba(237,233,225,0.55);line-height:1.55;margin-bottom:14px;}
.now-window-bar{height:3px;background:rgba(237,233,225,0.12);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.now-window-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 0.5s ease;}
.now-window-footer{font-size:11px;color:rgba(237,233,225,0.35);}

/* SCHEDULE CARD */
.schedule-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.schedule-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px;}
.schedule-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:0.5px solid var(--sep);}
.schedule-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.schedule-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.schedule-content{flex:1;}
.schedule-window{font-size:10px;letter-spacing:0.05em;margin-bottom:2px;font-weight:500;}
.schedule-activity{font-size:13px;font-weight:500;}
.schedule-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;}
.schedule-active-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(232,82,10,0.12);border-radius:10px;padding:2px 8px;margin-top:4px;}
.schedule-active-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);}
.schedule-active-text{font-size:10px;color:var(--orange);font-weight:500;}

/* CHECKIN CARD */
.checkin-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.checkin-card-left{}
.checkin-card-title{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.checkin-card-sub{font-size:13px;color:var(--ink);}
.checkin-card-arrow{color:var(--muted);font-size:16px;}

/* HORMONE CURVE CARD */
.curve-card{background:var(--card);border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:12px;}
.curve-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.curve-card-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.legend{display:flex;gap:10px;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:10px;height:2px;border-radius:1px;}
.legend-label{font-size:9px;color:var(--muted);}

/* METRICS ROW */
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.metric-card{background:var(--card);border-radius:12px;padding:10px 12px;}
.metric-label{font-size:9px;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:4px;}
.metric-val{font-size:20px;font-weight:500;line-height:1;}

/* COACH CARD */
.coach-card{background:var(--card-peach);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;}
.coach-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-top:5px;flex-shrink:0;}
.coach-title{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:3px;}
.coach-text{font-size:12px;color:rgba(26,22,18,0.65);line-height:1.55;}

/* WEEK ROW */
.week-section-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;}
.week-row{display:flex;justify-content:space-between;margin-bottom:14px;flex-wrap:nowrap;}
.week-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.week-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.week-dot.done{background:var(--ink);}
.week-dot.wtoday{background:var(--orange);}
.week-dot.empty{border:0.5px solid var(--sep);}
.week-dot-label{font-size:9px;color:var(--muted);letter-spacing:0.04em;}
.week-dot-label.wtoday{color:var(--orange);}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:calc(14px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:358px;
  z-index:100;
  background:rgba(230,225,216,0.72);
  -webkit-backdrop-filter:blur(18px) saturate(1.1);
  backdrop-filter:blur(18px) saturate(1.1);
  padding:7px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:2px;
  border-radius:40px;
  border:0.5px solid rgba(26,22,18,0.06);
  box-shadow:0 8px 30px rgba(26,22,18,0.14);
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  padding:8px 12px;
  border-radius:16px;
  min-width:56px;
  transition:background 0.15s;
}
.nav-item.active{background:var(--ink);border-radius:26px;padding:9px 18px;}
.nav-item-label{font-size:9px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;}
.nav-item.active .nav-item-label{color:#EDE9E1;}
.nav-item:not(.active) .nav-item-label{color:var(--muted);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,22,18,0.45);opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:110;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{position:fixed;bottom:0;left:0;right:0;width:min(390px,100%);margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 24px calc(40px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);z-index:111;max-height:88%;overflow-y:auto;}
.modal-sheet.open{transform:translateY(0);}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--sep);margin:0 auto 20px;}
.modal-title{font-size:20px;font-weight:400;color:var(--ink);margin-bottom:4px;letter-spacing:-0.01em;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
</style>
</head>
<body>
<div class="phone">

<!-- LOGIN (sign in — reached from the onboarding "sign in" link, for returning users) -->
<div class="screen" id="screen-login">
  <div class="login-wrap">
    <div class="login-logo">arco</div>
    <div class="login-tag">recovery system</div>
    <!-- STAGE 1: EMAIL -->
    <div id="login-email-stage" style="width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;">
      <button class="login-back" onclick="showScreen('screen-onboard')">&larr; back</button>
      <input class="login-input" id="login-email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" onkeydown="if(event.key==='Enter')sendCode('login')">
      <button class="login-btn" id="login-email-btn" onclick="sendCode('login')">Continue</button>
      <div class="login-note" id="login-email-note">enter your email to sign in</div>
    </div>
    <!-- STAGE 2: CODE -->
    <div id="login-code-stage" style="width:100%;max-width:300px;display:none;flex-direction:column;align-items:center;text-align:center;">
      <button class="login-back" id="login-back" onclick="backToEmail('login')">&larr; change email</button>
      <div class="login-sent-sub">enter the 6-digit code sent to<br><span id="login-code-email" style="color:var(--orange);"></span></div>
      <input class="login-input login-code-input" id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" oninput="onCodeInput(this,'login')">
      <div class="login-note" id="login-code-note" style="opacity:0;">&nbsp;</div>
      <button class="login-link" id="login-resend" onclick="resendCode('login')">resend code</button>
    </div>
  </div>
</div>

<!-- ONBOARDING -->
<div class="screen active" id="screen-onboard">
  <div class="ob-header">
    <div class="ob-logo">arco</div>
    <div class="ob-sub">recovery system</div>
  </div>
  <div class="ob-body" id="ob-body"></div>
</div>

<!-- LOADING -->
<div class="screen" id="screen-loading">
  <div class="loading-wrap">
    <div class="loading-logo">arco</div>
    <div class="loading-tag">building your arc</div>
    <div class="loading-track"><div class="loading-fill" id="load-bar"></div></div>
    <div class="loading-msg" id="load-msg">analysing your profile...</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="screen" id="screen-dash">
  <div class="topbar">
    <div class="topbar-streak">
      <span class="topbar-today-arrow" style="transform:rotate(180deg);display:inline-block;">›</span>
      <span class="topbar-streak-count" id="streak-ct">1</span>
      <span class="topbar-streak-label">day</span>
      <span class="topbar-today-arrow">›</span>
    </div>
    <span style="font-size:22px;font-weight:300;color:var(--ink);letter-spacing:-0.03em;">arco</span>
    <div class="topbar-today">
      <span class="topbar-today-arrow" style="transform:rotate(180deg);display:inline-block;">›</span>
      <span class="topbar-today-label">Today</span>

// ── HORMONE ENGINE ──
const CURVES={
  cortisol:[[0,.10],[2,.08],[4,.18],[5.5,.45],[6.5,.82],[7.5,.95],[9,.90],[11,.78],[13,.60],[15,.42],[17,.35],[19,.25],[21,.15],[22,.10],[24,.10]],
  melatonin:[[0,.88],[2,.92],[4,.75],[5.5,.40],[7,.10],[9,.04],[14,.04],[17,.06],[19,.18],[21,.52],[22,.78],[23,.88],[24,.88]],
  testosterone:[[0,.30],[2,.55],[4,.82],[6,.95],[7.5,1.00],[9,.92],[11,.80],[13,.68],[15,.55],[17,.50],[19,.42],[21,.35],[22,.30],[24,.30]],
};
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v){return Math.min(1,Math.max(0,v));}
function baseVal(name,h){
  const c=CURVES[name];
  for(let i=0;i<c.length-1;i++){if(h>=c[i][0]&&h<c[i+1][0]){const t=(h-c[i][0])/(c[i+1][0]-c[i][0]);return lerp(c[i][1],c[i+1][1],t);}}
  return c[c.length-1][1];
}
function getHormones(h,p,mod={}){
  const wake=p.wake??7,sq=p.sleepQuality??3,stress=p.stress??2,train=p.trainingTime??'afternoon',caff=p.caffeine??'morning',age=parseInt(p.age)||25;
  let cor=baseVal('cortisol',h),mel=baseVal('melatonin',h),tes=baseVal('testosterone',h);
  cor=clamp(cor-(wake-7)*0.04);
  const sw=h-wake;if(sw>=0&&sw<0.5)cor=clamp(cor+0.18*(1-sw/0.5));
  const sqD=(sq-3)*0.07;cor=clamp(cor+sqD);tes=clamp(tes+sqD*0.8);mel=clamp(mel-sqD*0.2);
  const stD=(stress-2)*0.055;if(h>10&&h<22)cor=clamp(cor+stD);mel=clamp(mel-stD*0.25);
  if(train==='morning'&&h>=6&&h<=10)tes=clamp(tes+0.09);
  if(train==='afternoon'&&h>=15&&h<=19){tes=clamp(tes+0.10);cor=clamp(cor+0.05);}
  if(train==='evening'&&h>=18&&h<=21){tes=clamp(tes+0.07);mel=clamp(mel-0.12);}
  const agD=age<25?0.05:age>35?-0.08:-(age-25)*0.008;tes=clamp(tes+agD);
  if(caff==='afternoon'&&h>=19)mel=clamp(mel-0.10);
  if(caff==='evening'&&h>=18)mel=clamp(mel-0.22);
  cor=clamp(cor+(mod.cortisol??0));mel=clamp(mel+(mod.melatonin??0));tes=clamp(tes+(mod.testosterone??0));
  return{cortisol:cor,melatonin:mel,testosterone:tes};
}
function getPhase(h,p){
  const wake=p.wake??7;
  if(h<wake-0.25)return{label:'deep sleep',advice:'Growth hormone peaks now. Every hour cut short reduces muscle repair and fat metabolism.'};
  if(h<wake+0.5)return{label:'cortisol awakening',advice:'Cortisol at 50–100% above baseline. Suppresses testosterone for ~45 minutes. Get sunlight now. Don\'t train yet.'};
  if(h<wake+2.5)return{label:'peak cortisol',advice:'Acetylcholine peak: focus and pattern recognition at their highest. Caffeine now extends the window. After 11:00 it delays sleep onset.'};
  if(h<13)return{label:'peak focus',advice:'Prefrontal cortex at full capacity. Working memory, decision quality, verbal reasoning all peak now.'};
  if(h<15)return{label:'afternoon dip',advice:'Core temp dropped ~0.5°C, the same trigger as sleep onset. 20 minutes enters Stage 2 sleep and restores alertness. Longer hits slow-wave and impairs waking.'};
  if(h<17.5)return{label:'recovery window',advice:'Second cortisol curve. Reaction time and verbal processing return. Muscle temp 1°C above baseline, injury risk at daily low.'};
  if(h<19.5)return{label:'wind down',advice:'Melatonin rising. Blue light delays it by up to 3 hours. Dim lights and reduce screen exposure now.'};
  if(h<21)return{label:'melatonin rising',advice:'Core temp falling. A warm shower dilates skin vessels to release heat, accelerating the drop and reducing sleep onset time.'};
  return{label:'sleep prep',advice:'Core temp needs to drop 1°C to trigger sleep onset. Room at 18°C. Every hour of delay compresses slow-wave sleep.'};
}
function arcScore(p,checkins,todayMod){
  const sq=p.sleepQuality??3;
  const stress=p.stress??2;
  const streak=getStreak(checkins);
  const trained=todayMod.trained===true?1:0;
  const sleepScore=(sq/5)*100;
  const stressScore=((5-stress)/4)*100;
  const streakScore=Math.min(streak/30,1)*100;
  const trainScore=trained*100;
  return Math.round(sleepScore*0.30+stressScore*0.30+streakScore*0.20+trainScore*0.20);
}
function arcLabel(score){
  if(score>=80)return'OPTIMAL';
  if(score>=60)return'REGULATED';
  return'DYSREGULATED';
}

function fmtTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function updateClocks(){
  const t=fmtTime(new Date());
  ['sb-ob','sb-load','sb-dash'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=t;});
}

function getStreak(ci){
  const dates=[...new Set((ci||checkins).map(c=>c.date))].sort().reverse();
  if(!dates.length)return 1;
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){if(dates.includes(d.toDateString())){s++;d.setDate(d.getDate()-1);}else break;}
  return Math.max(s,1);
}

function renderStep(){
  const step=steps[currentStep];
  const dots=steps.map((_,i)=>`<div class="step-dot${i<currentStep?' done':i===currentStep?' active':''}"></div>`).join('');
  document.getElementById('ob-body').innerHTML=`
    ${(currentStep>0||_redoMode)?`<button class="ob-back" onclick="prevStep()">&larr; back</button>`:''}
    <div class="step-bar">${dots}</div>
    <div class="step-title">${step.title}</div>
    <div class="step-sub">${step.sub}</div>
    ${step.render()}
    <div style="flex:1;min-height:16px;"></div>
    <button class="btn btn-ink" onclick="nextStep()">${currentStep===steps.length-1?'build my arc →':'continue →'}</button>
    ${currentStep===0&&!_redoMode?`<div style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted);">already have an account? <button class="ob-signin" onclick="showScreen('screen-login')">sign in</button></div>`:''}`;
  if(step.render_after) step.render_after();
}
window.nextStep=function(){
  steps[currentStep].save();currentStep++;
  if(currentStep>=steps.length){
    // On profile creation, capture latitude context (not used in scoring yet).
    try{ profile.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ profile.timezone = null; }
    // Prefer the real geocoded latitude; fall back to the timezone approximation only if no city resolved.
    profile.latBand = (typeof profile.lat==='number') ? deriveLatBandFromLat(profile.lat) : deriveLatBand(profile.timezone);
    localStorage.setItem('arco-profile',JSON.stringify(profile));
    _redoMode = false; _profileSnapshot = null;   // changes committed; drop the redo snapshot
    showLoading();
  }
  else renderStep();
};

// Back arrow: previous step, or (on step 0 during a redo) exit without saving changes.

// Approximate latitude band from an IANA timezone (no onboarding question needed).
// Banded by |latitude|: 'high' >50°, 'mid' 35–50°, 'low' <35°. Unrecognised → 'high'.
function deriveLatBand(tz){
  const LAT = {
    'Europe/London':51,'Europe/Dublin':53,'Europe/Lisbon':39,'Europe/Madrid':40,'Europe/Paris':49,
    'Europe/Brussels':51,'Europe/Amsterdam':52,'Europe/Berlin':53,'Europe/Rome':42,'Europe/Zurich':47,
    'Europe/Vienna':48,'Europe/Prague':50,'Europe/Warsaw':52,'Europe/Stockholm':59,'Europe/Oslo':60,
    'Europe/Copenhagen':56,'Europe/Helsinki':60,'Europe/Athens':38,'Europe/Istanbul':41,'Europe/Moscow':56,
    'Europe/Kyiv':50,'Europe/Bucharest':44,'Europe/Budapest':47,
    'America/New_York':41,'America/Toronto':44,'America/Chicago':42,'America/Denver':40,
    'America/Los_Angeles':34,'America/Vancouver':49,'America/Edmonton':54,'America/Winnipeg':50,
    'America/Halifax':45,'America/Phoenix':33,'America/Mexico_City':19,'America/Bogota':5,
    'America/Lima':-12,'America/Sao_Paulo':-24,'America/Argentina/Buenos_Aires':-35,'America/Anchorage':61,
    'Asia/Tokyo':36,'Asia/Seoul':38,'Asia/Shanghai':31,'Asia/Hong_Kong':22,'Asia/Singapore':1,
    'Asia/Bangkok':14,'Asia/Kolkata':22,'Asia/Dubai':25,'Asia/Jerusalem':32,'Asia/Tehran':36,'Asia/Karachi':25,
    'Africa/Cairo':30,'Africa/Johannesburg':-26,'Africa/Lagos':6,'Africa/Nairobi':-1,
    'Australia/Sydney':-34,'Australia/Melbourne':-38,'Australia/Perth':-32,'Australia/Brisbane':-27,
    'Pacific/Auckland':-37
  };
  const lat = LAT[tz];
  if(lat === undefined) return 'high';   // conservative default when unrecognised
  const a = Math.abs(lat);
  return a>50 ? 'high' : (a>=35 ? 'mid' : 'low');
}

// ── CITY / GEOCODING (Open-Meteo, no key) ──
// latBand straight from a real latitude, superseding the timezone approximation above.
function deriveLatBandFromLat(lat){ const a=Math.abs(lat); return a>50 ? 'high' : (a>=35 ? 'mid' : 'low'); }
// Best-guess city label from an IANA timezone, just to prefill the input.
function tzCity(tz){ if(!tz) return ''; const parts=String(tz).split('/'); return parts[parts.length-1].replace(/_/g,' '); }
function currentTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return null; } }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const CITY_FALLBACK = {lat:51.5074, lon:-0.1278}; // London, used only when geocoding is unreachable

// Store a chosen city onto the profile and re-derive latBand from its real latitude.
function applyCity(name, country, lat, lon, isFallback){
  profile.city = name; profile.country = country||''; profile.lat = lat; profile.lon = lon;
  profile.latBand = deriveLatBandFromLat(lat);
  if(isFallback) profile.cityFallback = true; else delete profile.cityFallback;
}

// ── DAILY WEATHER (Open-Meteo, no key) ─────────────────────────────────────
// Two calls (forecast + air quality), one shared daily cache keyed by date+lat/lon,
// with a separate key per endpoint so one failure retries while a success never
// refetches. Everything is wrapped in try/catch: on any failure the app behaves
// exactly as if weather did not exist — nothing is surfaced to the user.
const WEATHER_CACHE_KEY = 'arco-weather';
const _pad2 = n => String(n).padStart(2,'0');
function _todayStr(){ const d=new Date(); return `${d.getFullYear()}-${_pad2(d.getMonth()+1)}-${_pad2(d.getDate())}`; }
function weatherCacheId(lat, lon){ return `${_todayStr()}|${Number(lat).toFixed(3)},${Number(lon).toFixed(3)}`; }
function isoToDecimal(iso){ if(!iso) return null; const t=String(iso).split('T')[1]; if(!t) return null; const [h,m]=t.split(':').map(Number); return h+(m||0)/60; }
function _pctile(sortedAsc, p){ if(!sortedAsc.length) return null; return sortedAsc[Math.min(sortedAsc.length-1, Math.floor(p*(sortedAsc.length-1)))]; }

function applyWeatherToProfile(w){
  if(!w) return;
  ['forecast','uvToday','sunriseToday','sunsetToday','daylightMinutes','daylightDeltaMin',
   'pm25','no2','no2Peak','no2Baseline','pollenHigh'].forEach(k=>{ if(w[k]!=null) profile[k]=w[k]; });
}

async function loadWeather(){
  try{
    if(typeof profile.lat!=='number' || typeof profile.lon!=='number') return;   // no location yet
    const id = weatherCacheId(profile.lat, profile.lon);
    let cache={}; try{ cache=JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)||'{}')||{}; }catch(e){ cache={}; }
    let changed=false;

    // ---- FORECAST: UV + daylight + 7-day planning, one request ----
    if(cache.forecastKey!==id){
      try{
        const u=`https://api.open-meteo.com/v1/forecast?latitude=${profile.lat}&longitude=${profile.lon}`+
                `&daily=uv_index_max,sunrise,sunset,daylight_duration,precipitation_sum,precipitation_probability_max,temperature_2m_max`+
                `&timezone=auto&forecast_days=7`;
        const d=(await (await fetch(u)).json()).daily;
        if(d&&d.time){
          const days=d.time.map((date,i)=>({
            date,
            uv: d.uv_index_max?d.uv_index_max[i]:null,
            sunrise: d.sunrise?isoToDecimal(d.sunrise[i]):null,
            sunset: d.sunset?isoToDecimal(d.sunset[i]):null,
            daylightMin: (d.daylight_duration&&d.daylight_duration[i]!=null)?Math.round(d.daylight_duration[i]/60):null,
            precip: d.precipitation_sum?d.precipitation_sum[i]:null,
            precipProb: d.precipitation_probability_max?d.precipitation_probability_max[i]:null,
            tmax: d.temperature_2m_max?d.temperature_2m_max[i]:null
          }));
          cache.forecast=days;
          cache.uvToday=days[0].uv;
          cache.sunriseToday=days[0].sunrise;
          cache.sunsetToday=days[0].sunset;
          cache.daylightMinutes=days[0].daylightMin;
          // Daylight slope from the 7-day array (positive = shrinking). Works on first run, low noise.
          const first=days[0].daylightMin, last=days[days.length-1].daylightMin;
          cache.daylightDeltaMin=(first!=null&&last!=null&&days.length>1)?(first-last)/(days.length-1):null;
          cache.forecastKey=id; changed=true;
        }
      }catch(e){/* silent */}
    }

    // ---- AIR QUALITY: pm2.5 + NO2 + pollen, relative to a 7-day local baseline ----
    if(cache.airKey!==id){
      try{
        const u=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${profile.lat}&longitude=${profile.lon}`+
                `&current=pm2_5,nitrogen_dioxide&hourly=nitrogen_dioxide,birch_pollen,grass_pollen,alder_pollen`+
                `&past_days=7&forecast_days=1&timezone=auto`;
        const j=await (await fetch(u)).json();
        if(j.current){ cache.pm25=j.current.pm2_5??null; cache.no2=j.current.nitrogen_dioxide??null; }
        const H=j.hourly;
        if(H&&H.time){
          const today=_todayStr(), isToday=t=>String(t).startsWith(today);
          // NO2: baseline = median of the past week; signal = today's commute-window (07:00-10:00) peak.
          const no2=H.nitrogen_dioxide||[];
          const no2Sorted=no2.filter(x=>typeof x==='number').sort((a,b)=>a-b);
          cache.no2Baseline=_pctile(no2Sorted,0.5);
          let peak=null;
          H.time.forEach((t,i)=>{ if(isToday(t)){ const hr=+String(t).split('T')[1].split(':')[0]; if(hr>=7&&hr<10&&typeof no2[i]==='number') peak=Math.max(peak==null?-1:peak, no2[i]); } });
          cache.no2Peak=peak;
          // POLLEN: relative to the type's own recent range. Highest-peaking type wins.
          let best=null, bestRaw=-1;
          [['birch',H.birch_pollen],['grass',H.grass_pollen],['alder',H.alder_pollen]].forEach(([type,arr])=>{
            if(!Array.isArray(arr)) return;
            const nums=arr.filter(x=>typeof x==='number'); if(!nums.length) return;
            const sorted=[...nums].sort((a,b)=>a-b);
            const p50=_pctile(sorted,0.5), p90=_pctile(sorted,0.9);
            let todayPeak=null;
            H.time.forEach((t,i)=>{ if(isToday(t)&&typeof arr[i]==='number') todayPeak=Math.max(todayPeak==null?-1:todayPeak, arr[i]); });
            if(todayPeak==null) return;
            // "upper part of its own recent range"; p90>p50 guards against all-zero / out-of-season.
            const high = todayPeak>0 && p90>p50 && todayPeak>=p90;
            if(todayPeak>bestRaw){ bestRaw=todayPeak; best={type, Type:type[0].toUpperCase()+type.slice(1), value:Math.round(todayPeak), high}; }
          });
          if(best) cache.pollenHigh=best;
        }
        cache.airKey=id; changed=true;
      }catch(e){/* silent */}
    }

    if(changed){ try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(cache)); }catch(e){} }
    applyWeatherToProfile(cache);
  }catch(e){/* silent: app behaves exactly as without weather */}
}

// Whether they are indoors for the entire daylight window on a workday.
// Returns { leavesBeforeSunrise, arrivesAfterSunset, workdayDaylightMinutes }.
function computeDaylightExposure(p){
  const sr=p.sunriseToday, ss=p.sunsetToday;
  if(sr==null||ss==null) return null;
  const leave = typeof p.workStart==='number' ? p.workStart : (p.wakeTime??p.wake);
  const home  = typeof p.workEnd==='number'   ? p.workEnd   : (p.bedTime??p.bed);
  const leavesBeforeSunrise = typeof leave==='number' ? leave<=sr : false;
  const arrivesAfterSunset  = typeof home==='number'  ? home>=ss  : false;
  let free;
  if(typeof p.workStart==='number' && typeof p.workEnd==='number'){
    free = Math.max(0, p.workStart-sr)*60 + Math.max(0, ss-p.workEnd)*60;
  } else { free = Math.max(0, ss-sr)*60; }
  return { leavesBeforeSunrise, arrivesAfterSunset, workdayDaylightMinutes: Math.round(free) };
}

// Weekly outdoor/training plan from the 7-day forecast.
function planWeek(p){
  const f=p.forecast; if(!Array.isArray(f)||f.length<2) return null;
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const freqMap={'1-2':2,'3-4':3,'5+':5};
  const trainCount=freqMap[p.trainingFreq]??3;
  const trainDecimal={morning:7,afternoon:14,evening:20}[p.trainingTime]??null;
  const days=f.map((d,i)=>{
    const dt=new Date(d.date+'T12:00');
    return {...d, i, name:DOW[dt.getDay()],
      outdoorOK:(d.precipProb==null?true:d.precipProb<40)&&(d.tmax==null||d.tmax>=8)};
  });
  const restCount=Math.max(0,7-trainCount);
  const byClear=[...days].sort((a,b)=>(a.precipProb??0)-(b.precipProb??0)||(a.precip??0)-(b.precip??0));
  const restSet=new Set(byClear.slice(0,restCount).map(d=>d.i));
  days.forEach(d=>{ d.suggestion=restSet.has(d.i)?'rest':'train'; d.outside=d.outdoorOK; });
  const warm=days.filter(d=>d.tmax!=null&&d.tmax>15);
  const lastWarmDay=warm.length?warm[warm.length-1]:null;
  const sunsetBeforeTraining=(trainDecimal!=null)?days.find(d=>d.sunset!=null&&d.sunset<trainDecimal):null;
  return {days, lastWarmDay, sunsetBeforeTraining, trainCount, trainDecimal};
}

// ── DIAGNOSIS ENGINE ──
function runDiagnosis(p){
  const month = new Date().getMonth()+1;
  const isWinter = [10,11,12,1,2,3].includes(month);   // Oct–March (high-latitude synthesis gap)
  const isVegan = p.diet==='vegan';
  const isVegetarian = p.diet==='vegetarian'||p.diet==='vegan';
  const noFish = p.fish==='never';
  const lowFish = p.fish==='sometimes'||p.fish==='never';
  const highAlcohol = p.alcohol==='high'||p.alcohol==='moderate';
  const trainsFrequently = ['3-4','5+'].includes(p.trainingFreq);
  const onMetformin = (p.meds||[]).includes('metformin');
  const onPPI = (p.meds||[]).includes('ppi');
  const onStatins = (p.meds||[]).includes('statins');
  const onWarfarin = (p.meds||[]).includes('warfarin');
  const highStress = p.stress>=4;
  const age = parseInt(p.age)||25;

  // ── SCORING (declarative) ──
  // Each supplement's rules live here as data, so `max` (its theoretical ceiling) is derived
  // from the same weights as the live score and can't drift when a rule changes. A factor is
  // {when, weight, reason} (independent) or {oneOf:[...]} (first match wins; contributes its
  // largest branch to max). `floor` clamps the score up to a minimum without stacking (vitd
  // winter). `cutoff` is the per-supplement surface threshold.
  const ctx = {
    isWinter, isVegan, isVegetarian, noFish, lowFish, highAlcohol, trainsFrequently,
    onMetformin, onPPI, onStatins, onWarfarin, highStress, age,
    sunlight: p.sunlight,
    indoorWork: ['banking','corporate','startup','founder'].includes(p.workType)
  };
  const SCORING = [
    { id:'vitd', cutoff:3,
      // Seasonal rule calibrated for latBand 'high' (>50°N) only; latBand is captured but unused here.
      note:'Most people in Northern Europe are deficient October–March. This is the single highest-yield intervention for your profile.',
      factors:[
        {oneOf:[
          {when:c=>c.sunlight==='rarely'&&c.indoorWork, weight:3, reason:'Indoor work 08:00–21:00 + rarely outdoors, effectively zero synthesis year-round'},
          {when:c=>c.sunlight==='rarely', weight:2, reason:'Minimal outdoor sun exposure'},
          {when:c=>c.sunlight==='sometimes', weight:1, reason:'Limited sun exposure'},
        ]},
        {when:c=>c.trainsFrequently, weight:1, reason:'Training sweat losses increase turnover'},
      ],
      floor:{when:c=>c.isWinter, value:3, reason:'Zero cutaneous synthesis at this latitude October–March'},
    },
    { id:'magnesium', cutoff:2,
      note:'Glycinate form specifically. Oxide (most commonly sold) absorbs at ~4% vs glycinate at ~80%.',
      factors:[
        {when:c=>c.trainsFrequently, weight:3, reason:'Sweat losses ~2.5–3 mg per session'},
        {when:c=>c.highAlcohol, weight:2, reason:'Alcohol causes renal magnesium wasting'},
        {when:c=>c.onPPI, weight:2, reason:'PPIs impair magnesium absorption: FDA hypomagnesemia warning'},
        {when:c=>c.highStress, weight:1, reason:'Cortisol promotes renal magnesium wasting'},
      ],
    },
    { id:'omega3', cutoff:2,
      note:'Check EPA content specifically: most capsules contain only ~300 mg EPA+DHA per 1,000 mg capsule.',
      factors:[
        {oneOf:[
          {when:c=>c.noFish, weight:3, reason:'No oily fish intake: primary dietary source is absent'},
          {when:c=>c.lowFish, weight:2, reason:'Less than 2 portions of oily fish per week'},
        ]},
        {when:c=>c.isVegetarian, weight:2, reason:'ALA to EPA conversion is less than 10%: plant sources insufficient'},
      ],
    },
    { id:'creatine', cutoff:2,
      note:'Not a deficiency: the highest-evidence performance supplement that exists. 3–5 g/day monohydrate.',
      factors:[
        {when:c=>c.trainsFrequently, weight:3, reason:'Resistance training amplifies creatine benefit significantly'},
        {when:c=>c.isVegetarian, weight:2, reason:'Vegans and vegetarians have ~20–30% lower baseline muscle creatine'},
      ],
    },
    { id:'zinc', cutoff:2,
      note:'Bisglycinate or picolinate form only. Oxide is 43% less bioavailable. Pair with 1–2 mg copper.',
      factors:[
        {when:c=>c.isVegetarian, weight:3, reason:'Phytate in grains and legumes chelates zinc. Requirements ~50% higher'},
        {when:c=>c.trainsFrequently, weight:2, reason:'Sweat and urinary losses during training'},
        {when:c=>c.highAlcohol, weight:1, reason:'Alcohol impairs zinc absorption'},
      ],
    },
    { id:'b12', cutoff:2,
      note:'1,000 µg/day oral. Methyl vs cyano form makes minimal difference for most people despite marketing claims.',
      factors:[
        {oneOf:[
          {when:c=>c.isVegan, weight:5, reason:'Vegan diet: B12 is absent from plant foods. Supplementation is mandatory'},
          {when:c=>c.isVegetarian, weight:3, reason:'Vegetarian diet: limited dietary B12 sources'},
        ]},
        {when:c=>c.onMetformin, weight:3, reason:'Metformin use: OR 4.72 for deficiency vs non-users (PLoS One 2018)'},
        {when:c=>c.onPPI, weight:2, reason:'PPIs reduce acid needed to release food-bound B12'},
        {when:c=>c.age>=50, weight:2, reason:'Absorption declines with age due to reduced intrinsic factor'},
      ],
    },
    { id:'ashwagandha', cutoff:3,
      note:'KSM-66 extract specifically at 600 mg/day. Effect accumulates over 4–8 weeks. Legal claim status in UK is unclear. Avoid disease claims.',
      factors:[
        {when:c=>c.highStress, weight:3, reason:'Elevated stress: KSM-66 reduced cortisol ~27.9% in RCT (Chandrasekhar 2012)'},
        {when:c=>c.trainsFrequently&&c.highStress, weight:1, reason:'Combined training stress + psychological stress increases HPA axis load'},
      ],
    },
    { id:'coq10', cutoff:3,
      note:'Ubiquinol form. 100–200 mg/day with a fat-containing meal. Note: NICE does not currently recommend this for statin myopathy but depletion is real.',
      factors:[
        {when:c=>c.onStatins, weight:3, reason:'Statins inhibit HMG-CoA reductase, the shared pathway for both cholesterol and CoQ10 synthesis'},
      ],
    },
  ];

  // Evaluate a spec → {score, max, reasons}. max sums each factor's ceiling (oneOf = its
  // largest branch), then floor raises the minimum for both score and max.
  function evalSpec(spec){
    let score = 0, max = 0;
    const reasons = [];
    for(const f of spec.factors){
      if(f.oneOf){
        max += Math.max(...f.oneOf.map(o=>o.weight));
        for(const o of f.oneOf){ if(o.when(ctx)){ score += o.weight; reasons.push(o.reason); break; } }
      } else {
        max += f.weight;
        if(f.when(ctx)){ score += f.weight; reasons.push(f.reason); }
      }
    }
    if(spec.floor){
      max = Math.max(max, spec.floor.value);
      if(spec.floor.when(ctx)){ score = Math.max(score, spec.floor.value); reasons.unshift(spec.floor.reason); }
    }
    return {score, max, reasons};
  }

  // Evaluate every supplement; keep the full result in evalMap (even if it doesn't surface,
  // for the stack cross-ref below), and push the ones that clear their cutoff.
  const results = [];
  const evalMap = {};
  for(const spec of SCORING){
    const {score, max, reasons} = evalSpec(spec);
    evalMap[spec.id] = {score, max, cutoff:spec.cutoff, reasons};
    if(score >= spec.cutoff){
      results.push({id:spec.id, score, max, cutoff:spec.cutoff, reasons, note:spec.note, contraindicated:false});
    }
  }

  // ── K2 ── companion to D3 / contraindicated on warfarin. Fixed value (max === cutoff),
  // and depends on vitd's computed score, so it sits outside the declarative loop.
  if(!onWarfarin && evalMap.vitd.score >= 3){
    results.push({id:'k2', score:2, max:2, cutoff:2,
      reasons:['Vitamin D increases calcium absorption. K2 MK-7 directs it to bone, not arteries'],
      note:'MK-7 form, 90–180 µg/day. Synergistic with Vitamin D. ABSOLUTE contraindication if on warfarin.',
      contraindicated: false});
  }
  if(onWarfarin){
    results.push({id:'k2', score:0, max:2, cutoff:2,
      reasons:['Warfarin detected: K2 directly antagonises vitamin K antagonist anticoagulants'],
      note:'Do not take K2 with warfarin without physician supervision.',
      contraindicated: true});
  }

  // ── Normalize each surfaced result to its own [cutoff … max] range so score and confidence
  // are comparable across supplements with very different ceilings (b12 tops out at 12, k2 at 2).
  // `normalized` is ONLY meaningful when a supplement has a gradable range (max > cutoff).
  // Binary / all-or-nothing rules (max === cutoff, e.g. k2, coq10) have no range to scale across,
  // so they are excluded from the normalized confidence gate and get a fixed MODERATE — a
  // supplement isn't high-confidence just for being binary. ──
  results.forEach(r=>{
    if(r.contraindicated){ r.normalized = null; r.confidence = 'CONTRAINDICATED'; return; }
    if(r.max === r.cutoff){ r.normalized = null; r.confidence = 'MODERATE'; return; }
    r.normalized = Math.min(1, Math.max(0, (r.score - r.cutoff) / (r.max - r.cutoff)));
    r.confidence = r.normalized >= 0.66 ? 'HIGH' : r.normalized >= 0.33 ? 'MODERATE' : 'LOW';
  });

  // Sort by normalized (contraindicated last; raw score as tiebreak). Binary supplements have
  // null normalized (not gradable) — rank them at the BOTTOM of the MODERATE tier (the 0.33 gate),
  // so a companion like k2 sits below the gradable MODERATEs but above the LOWs.
  const normKey = r => r.normalized == null ? 0.33 : r.normalized;
  results.sort((a,b)=>{
    if(a.contraindicated&&!b.contraindicated) return 1;
    if(!a.contraindicated&&b.contraindicated) return -1;
    if(normKey(b) !== normKey(a)) return normKey(b) - normKey(a);
    return b.score - a.score;
  });

  // ── Cross-reference the user's current stack (profile.currentStack) ──
  // Does NOT affect score or rank — annotation only.
  const stack = Array.isArray(p.currentStack) ? p.currentStack : [];
  const surfacedIds = new Set(results.map(r=>r.id));
  // 1. Mark results the user already takes.
  results.forEach(r=>{ if(stack.includes(r.id)) r.alreadyTaking = true; });

  // 2. Split un-surfaced stack items using each supplement's computed score (from evalMap).
  //    Surface cutoff is 2 for most, 3 for vitd/ashwagandha — so a non-surfaced score of 2
  //    is a "just below the cutoff" (marginal) case, only reachable by the cutoff-3 supps;
  //    everything else that didn't surface is 0–1.
  //    score >= 2  → borderline (marginal — at/just below a cutoff)
  //    score 0–1   → flagged (genuinely no basis in this profile)
  const flagged = [];
  const borderline = [];
  stack.filter(id=>!surfacedIds.has(id)).forEach(id=>{
    const s = SUPPLEMENT_DB.supplements[id];
    const name = s ? s.name : id;
    const ev = evalMap[id];
    const score = ev ? ev.score : 0;
    const rs = ev ? ev.reasons : [];
    if(score >= 2){
      borderline.push({id, name, score,
        reason: 'Marginal, scored '+score+', just below the surface threshold for your profile'
          + (rs.length ? ': '+rs.join('; ') : '') + '.'});
    } else {
      flagged.push({id, name, score,
        reason: rs.length ? 'Little basis, only '+rs.join('; ')+'.'
                          : 'Nothing in your profile points to a need for it.'});
    }
  });
  // 3. Backwards compatible: still return the array, with flagged + borderline attached.
  results.flagged = flagged;
  results.borderline = borderline;

  return results;
}

// Shared "also in your stack" section — supplements the user takes that we did NOT recommend.
// borderline = marginal (just below cutoff); flagged = no basis for this profile.
function stackExtrasHTML(diagnosis){
  const items = [
    ...(diagnosis.borderline||[]).map(x=>({name:x.name, reason:x.reason, tag:'marginal', tagColor:'rgba(232,82,10,0.6)'})),
    ...(diagnosis.flagged||[]).map(x=>({name:x.name, reason:x.reason, tag:'not indicated', tagColor:'rgba(26,22,18,0.32)'}))
  ];
  if(!items.length) return '';
  const rows = items.map((x,i)=>`
    <div style="padding:13px 0;${i===items.length-1?'':'border-bottom:0.5px solid var(--sep);'}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;">
        <span style="font-size:13px;font-weight:500;color:rgba(26,22,18,0.6);">${x.name}</span>
        <span style="font-size:9px;font-weight:600;color:${x.tagColor};letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0;">${x.tag}</span>
      </div>
      <div style="font-size:11px;color:var(--muted);line-height:1.5;">${x.reason}</div>
    </div>`).join('');
  return `
    <div style="padding:4px 0 8px;">
      <div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px;">also in your stack</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.5;">You take these, but they're not a priority for your profile.</div>
    </div>
    <div style="background:var(--card);border-radius:var(--radius);padding:0 18px;margin-bottom:16px;">${rows}</div>`;
}

    <div style="background:var(--card);border-radius:var(--radius);padding:14px 12px 10px;margin-bottom:12px;">
      ${buildWeekRow()}
    </div>

    <div class="checkin-card" onclick="openCheckin()">
      <div class="checkin-card-left">
        <div class="checkin-card-title">check in</div>
        <div class="checkin-card-sub">How's your ${greeting} going?</div>
      </div>
      <div class="checkin-card-arrow">›</div>
    </div>
    <div style="height:20px;"></div>
  `;
  // Start animation loop for pulsing markers
  if(!window._clockLoop){
    window._clockLoop = true;
    (function loop(){
      const now2=new Date();
      const h2=now2.getHours()+now2.getMinutes()/60;
      drawClock(h2);
      requestAnimationFrame(loop);
    })();
  } else {
    drawClock(h);
  }
}

function drawClock(h){
  const canvas=document.getElementById('main-clock');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=2;
  const cx=170*dpr,cy=170*dpr,r=104*dpr,inner=63*dpr,SW=26*dpr;
  ctx.clearRect(0,0,680,680);

  const wake=profile.wake??7;
  const workStart=profile.workStart??9;
  const workEnd=profile.workEnd??18;
  const trainTime=profile.trainingTime??'evening';
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5,22);

  // Color stops at specific hours — the ring flows through these
  // Format: [hour, r, g, b, brightness 0-1]
  // Sleep=dark amber, wake=bright yellow, focus=bright orange, work=dark grey,
  // recovery=gold, train=bright amber, wind=deep amber fading to dark
  const colorMap=[
    {h:0,    r:120,g:80, b:10},   // dark sleep — deep amber brown
    {h:wake-0.25,r:100,g:65,b:8}, // just before wake — slightly lighter
    {h:wake, r:255,g:214,b:10},   // wake — bright yellow
    {h:wake+1,r:255,g:160,b:10},  // peak cortisol — orange
    {h:workStart,r:80,g:75,b:60}, // work starts — muted dark
    {h:workStart+2,r:60,g:58,b:48},// deep work — darkest
    {h:workEnd-1,r:70,g:65,b:50}, // late work — still dark
    {h:workEnd,r:180,g:130,b:20}, // work ends — warming up
    {h:trainStart,r:255,g:190,b:10},// train start — bright gold
    {h:trainStart+0.75,r:255,g:160,b:5},// peak train — deep orange
    {h:trainEnd,r:200,g:140,b:15},// train ends — settling
    {h:22,   r:140,g:95,b:12},   // wind down — amber
    {h:23,   r:100,g:68,b:10},   // pre sleep — dark amber
    {h:24,   r:120,g:80,b:10},   // midnight — dark again
  ];

  function getColor(hour){
    for(let i=0;i<colorMap.length-1;i++){
      if(hour>=colorMap[i].h&&hour<colorMap[i+1].h){
        const t=(hour-colorMap[i].h)/(colorMap[i+1].h-colorMap[i].h);
        const ease=t<0.5?2*t*t:(4-2*t)*t-1; // smooth ease
        return{
          r:Math.round(colorMap[i].r+(colorMap[i+1].r-colorMap[i].r)*ease),
          g:Math.round(colorMap[i].g+(colorMap[i+1].g-colorMap[i].g)*ease),
          b:Math.round(colorMap[i].b+(colorMap[i+1].b-colorMap[i].b)*ease),
        };
      }
    }
    return colorMap[colorMap.length-1];
  }

  // Day/night ring: colour aligned to real sunrise/sunset when we have them,
  // otherwise fall back to the previous decorative gradient.
  const hasSun = typeof profile.sunriseToday==='number' && typeof profile.sunsetToday==='number';
  const SR = profile.sunriseToday, SS = profile.sunsetToday;
  const GOLD=[214,158,52], DUSK=[196,116,40], NIGHT=[66,72,88];   // warm gold day, warm dawn/dusk, deep slate night
  const TW=1/3;                                                   // ~20 min soft transition either side
  const clamp01=x=>Math.max(0,Math.min(1,x));
  function daylightness(hr){
    // 0 = full night, 1 = full day, with smooth ramps across dawn and dusk
    if(hr>=SR-TW && hr<=SR+TW) return clamp01((hr-(SR-TW))/(2*TW));   // dawn
    if(hr>=SS-TW && hr<=SS+TW) return 1-clamp01((hr-(SS-TW))/(2*TW)); // dusk
    return (hr>SR+TW && hr<SS-TW) ? 1 : 0;
  }
  function ringColor(hr){
    const t=daylightness(hr), lerp=(a,b,u)=>a+(b-a)*u;
    let c;
    if(t<0.5){ const u=t/0.5; c=[lerp(NIGHT[0],DUSK[0],u),lerp(NIGHT[1],DUSK[1],u),lerp(NIGHT[2],DUSK[2],u)]; }
    else { const u=(t-0.5)/0.5; c=[lerp(DUSK[0],GOLD[0],u),lerp(DUSK[1],GOLD[1],u),lerp(DUSK[2],GOLD[2],u)]; }
    return c.map(Math.round);
  }
  const _wins = hasSun ? null : getWindowsSimple();

  // Draw ring as tiny arc segments
  const STEPS=360;
  for(let i=0;i<STEPS;i++){
    const t0=i/STEPS,t1=(i+1)/STEPS;
    const hMid=((t0*24)+(t1*24))/2;
    const a0=t0*Math.PI*2-Math.PI/2;
    const a1=t1*Math.PI*2-Math.PI/2;
    let col;
    if(hasSun){ col=ringColor(hMid); }
    else { const c=getColor(hMid); const b=_wins.some(w=>hMid>=w.s&&hMid<w.e&&h>=w.s&&h<w.e)?1.0:0.45; col=[Math.round(c.r*b),Math.round(c.g*b),Math.round(c.b*b)]; }
    ctx.beginPath();
    ctx.arc(cx,cy,r,a0-0.002,a1+0.002);
    ctx.strokeStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.lineWidth=SW;ctx.lineCap='butt';ctx.stroke();
  }

  // Thin track behind — draw full circle in very dark first
  // (already rendered above, this gives depth)

  // Inner face
  ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fillStyle='#EDE9E1';ctx.fill();

  // Chronotype: biological vs actual sleep window on an inner track, sitting under the
  // ring and markers. Bio window is wide and soft with ~45-min gradient edges (a
  // population estimate, not precise); actual window is thinner and crisper. Where they
  // diverge the offset shows without any label.
  {
    const ct = (typeof computeChronotype==='function') ? computeChronotype(profile) : null;
    if(ct){
      const trackR = inner + (r - SW/2 - inner) * 0.78;
      const angc = hh => (hh/24)*Math.PI*2 - Math.PI/2;
      const smooth = k => { k=Math.max(0,Math.min(1,k)); return k*k*(3-2*k); };
      const arcBand = (hA, hB, width, rgb, peak, fade) => {
        const dur = hoursUntil(hA, hB); if(dur<=0) return;
        const N = Math.max(6, Math.round(dur/0.08));
        for(let i=0;i<N;i++){
          const f0=i/N, f1=(i+1)/N, off=dur*((f0+f1)/2);
          const al = peak * smooth(Math.min(off, dur-off)/fade);
          if(al<=0.002) continue;
          ctx.beginPath();ctx.arc(cx,cy,trackR, angc(hA+dur*f0)-0.004, angc(hA+dur*f1)+0.004);
          ctx.strokeStyle=`rgba(${rgb},${al})`;ctx.lineWidth=width;ctx.lineCap='butt';ctx.stroke();
        }
      };
      arcBand(ct.bioBedTime, ct.bioWakeTime, 6*dpr,   '48,52,66', 0.22, 0.75);   // biological: soft, wide
      arcBand(ct.bedTime,    ct.wakeTime,    3.5*dpr, '26,22,18', 0.60, 0.20);   // actual: crisp, higher contrast
    }
  }

  // Sunrise / sunset ticks across the ring, with the times in small type just outside
  // and a tiny sunrise/sunset glyph beyond each.
  if(hasSun){
    const ang=hh=>(hh/24)*Math.PI*2 - Math.PI/2;
    [SR,SS].forEach((hh,idx)=>{
      const rising = idx===0;               // SR first (sun up), SS second (sun down)
      const a=ang(hh), ca=Math.cos(a), sa=Math.sin(a);
      const rIn=r-SW/2-2*dpr, rOut=r+SW/2+2*dpr;
      ctx.beginPath();
      ctx.moveTo(cx+ca*rIn, cy+sa*rIn);ctx.lineTo(cx+ca*rOut, cy+sa*rOut);
      ctx.strokeStyle='rgba(237,233,225,0.9)';ctx.lineWidth=1.5*dpr;ctx.stroke();
      // time
      const tR=r+SW/2 + 11*dpr;
      ctx.font=`600 ${8.5*dpr}px Switzer,sans-serif`;
      ctx.fillStyle='rgba(26,22,18,0.55)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(fmt(hh), cx+ca*tR, cy+sa*tR);
      // Legible glyphs: a rayed sun at sunrise, a crescent moon at sunset. Sit them
      // clear of the time label (its horizontal width reaches furthest near 3 o'clock).
      const iR=r+SW/2 + 34*dpr, ix=cx+ca*iR, iy=cy+sa*iR;
      ctx.strokeStyle='rgba(26,22,18,0.55)';ctx.fillStyle='rgba(26,22,18,0.55)';
      ctx.lineWidth=1.2*dpr;ctx.lineCap='round';
      if(rising){
        const rad=3*dpr;
        ctx.beginPath();ctx.arc(ix,iy,rad,0,Math.PI*2);ctx.stroke();
        for(let k=0;k<8;k++){ const ra=k*Math.PI/4, r1=rad+2*dpr, r2=rad+4.5*dpr;
          ctx.beginPath();ctx.moveTo(ix+Math.cos(ra)*r1, iy+Math.sin(ra)*r1);ctx.lineTo(ix+Math.cos(ra)*r2, iy+Math.sin(ra)*r2);ctx.stroke(); }
      } else {
        const rad=4.6*dpr;
        ctx.beginPath();
        ctx.arc(ix,iy,rad,0,Math.PI*2);
        ctx.arc(ix+rad*0.72, iy-rad*0.32, rad*1.02, 0, Math.PI*2);
        ctx.fill('evenodd');
      }
    });
  }

  // Supplement markers — connector line → dot → label
  const ABBREV = {
    vitd:'D3', magnesium:'Mg', omega3:'ω3', zinc:'Zn',
    creatine:'Cr', ashwagandha:'Ash', b12:'B12', k2:'K2',
    coq10:'Q10', magnesium_threonate:'MgT', iron:'Fe'
  };
  // Personalised windows; anytime supplements (creatine) get no clock dot.
  const sups2 = (profile.supplements || []).map(k => supView(k)).filter(s => s && !s.anytime);
  const hourGroups2 = {};
  sups2.forEach(s => {
    if(!hourGroups2[s.window[0]]) hourGroups2[s.window[0]] = [];
    hourGroups2[s.window[0]].push(s.key);
  });

  // Pulse factor — oscillates 0→1→0 over ~2 seconds
  const pulse = (Math.sin(Date.now() / 400) + 1) / 2;
  const dotR = 5*dpr;

  // State is carried by FILL, not colour: taken = solid, due = hollow + pulsing ring,
  // overdue = hollow solid stroke, upcoming = faint hollow. Monochrome ink.
  const INK = '26,22,18';
  // Signed angular distance (hours) of a relative to b, wrapping.
  const angSignedH = (a,b) => { let d=(a-b)%24; if(d>12)d-=24; if(d<-12)d+=24; return d; };
  const MARKER_CLEAR = 1.5;   // hours of angular clearance around the whole sun-marker block (tick+time+icon)
  sups2.forEach(s => {
    const key = s.key;
    const taken2 = takenToday.includes(key);
    const isDue2 = h >= s.window[0] && h < s.window[1];
    const group2 = hourGroups2[s.window[0]];
    const idx2 = group2.indexOf(key);
    const spread2 = group2.length > 1 ? (idx2 - (group2.length-1)/2) * 0.7 : 0;
    let supH = s.window[0] + spread2;
    // Treat each sun marker (tick + time label + icon) as one block and nudge a dot
    // angularly clear of it, to whichever side it already leans, so it never overlaps.
    if(hasSun){
      [SR,SS].forEach(mk => {
        const d = angSignedH(supH, mk);
        if(Math.abs(d) < MARKER_CLEAR) supH = mk + (d>=0 ? MARKER_CLEAR : -MARKER_CLEAR);
      });
    }
    const ma2 = (supH / 24) * Math.PI * 2 - Math.PI / 2;

    const ringEdge = r + SW/2;
    const dotDist = ringEdge + 13*dpr;
    const lblDist = ringEdge + 33*dpr;
    const dx2 = cx + Math.cos(ma2) * dotDist;
    const dy2 = cy + Math.sin(ma2) * dotDist;
    const lx2 = cx + Math.cos(ma2) * lblDist;
    const ly2 = cy + Math.sin(ma2) * lblDist;

    const isOverdue2 = !taken2 && h >= s.window[1];
    if(taken2){
      // taken: solid filled dot
      ctx.beginPath();ctx.arc(dx2,dy2,dotR,0,Math.PI*2);
      ctx.fillStyle=`rgba(${INK},0.9)`;ctx.fill();
    } else if(isDue2){
      // due now: hollow dot ringed by a subtle pulse
      ctx.beginPath();ctx.arc(dx2,dy2,dotR+(3+pulse*3)*dpr,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${INK},${0.22+pulse*0.33})`;ctx.lineWidth=1.5*dpr;ctx.stroke();
      ctx.beginPath();ctx.arc(dx2,dy2,dotR,0,Math.PI*2);
      ctx.fillStyle='#EDE9E1';ctx.fill();
      ctx.strokeStyle=`rgba(${INK},0.95)`;ctx.lineWidth=2*dpr;ctx.stroke();
    } else if(isOverdue2){
      // overdue: hollow solid-stroke ring, a touch stronger than upcoming
      ctx.beginPath();ctx.arc(dx2,dy2,dotR,0,Math.PI*2);
      ctx.fillStyle='#EDE9E1';ctx.fill();
      ctx.strokeStyle=`rgba(${INK},0.55)`;ctx.lineWidth=1.5*dpr;ctx.stroke();
    } else {
      // upcoming: faint hollow dot
      ctx.beginPath();ctx.arc(dx2,dy2,dotR,0,Math.PI*2);
      ctx.fillStyle='#EDE9E1';ctx.fill();
      ctx.strokeStyle=`rgba(${INK},0.4)`;ctx.lineWidth=1.5*dpr;ctx.stroke();
    }

    // Label
    const lblOp = taken2 ? 0.7 : isDue2 ? 1.0 : isOverdue2 ? 0.7 : 0.4;
    ctx.font = `600 ${9.5*dpr}px Switzer,sans-serif`;
    ctx.fillStyle = `rgba(${INK},${lblOp})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ABBREV[key] || key.slice(0,3).toUpperCase(), lx2, ly2);
  });

  // Hour figures — 0 / 6h / 12h / 18h in the gap between the inner face and the ring.
  {
    const bandMid = inner + (r - SW/2 - inner) * 0.3;   // inner part of the gap, clear of the sleep track
    ctx.font=`500 ${11*dpr}px Switzer,sans-serif`;
    ctx.fillStyle='rgba(26,22,18,0.34)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(let i=0;i<24;i+=6){
      const a=(i/24)*Math.PI*2-Math.PI/2;
      ctx.fillText(i===0?'00h':i+'h', cx+Math.cos(a)*bandMid, cy+Math.sin(a)*bandMid);
    }
  }

  // Current-time marker — a thin accent line across the full ring width. Brand orange
  // sits outside the monochrome supplement scheme, so it never reads as a dose.
  const angle=(h/24)*Math.PI*2-Math.PI/2;
  const pulse2=(Math.sin(Date.now()/600)+1)/2;
  const cA=Math.cos(angle), sA=Math.sin(angle);
  const mIn=r-SW/2-3*dpr, mOut=r+SW/2+3*dpr;
  // soft under-glow
  ctx.beginPath();
  ctx.moveTo(cx+cA*mIn, cy+sA*mIn);ctx.lineTo(cx+cA*mOut, cy+sA*mOut);
  ctx.strokeStyle=`rgba(232,82,10,${0.12+pulse2*0.12})`;ctx.lineWidth=6*dpr;ctx.lineCap='round';ctx.stroke();
  // crisp line
  ctx.beginPath();
  ctx.moveTo(cx+cA*mIn, cy+sA*mIn);ctx.lineTo(cx+cA*mOut, cy+sA*mOut);
  ctx.strokeStyle='rgba(232,82,10,0.95)';ctx.lineWidth=2*dpr;ctx.lineCap='round';ctx.stroke();
}

function getWindowsSimple(){
  const wake=profile.wake??7;
  const workStart=profile.workStart??9;
  const workEnd=profile.workEnd??18;
  const trainTime=profile.trainingTime??'evening';
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5,22);
  return[
    {s:0,e:wake-0.25},
    {s:wake-0.25,e:wake+0.5},
    {s:wake+0.5,e:workStart},
    {s:workStart,e:workEnd},
    {s:workEnd,e:trainStart},
    {s:trainStart,e:trainEnd},
    {s:trainEnd,e:24},
  ].filter(seg=>seg.s<seg.e);
}

function getWindows(p){
  const wake=p.wake??7;
  const workStart=p.workStart??9;
  const workEnd=p.workEnd??18;
  const workType=p.workType??'corporate';
  const flex=p.flexibility??'some';
  const trainTime=p.trainingTime??'evening';

  // Derive training window from profile
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5, 22);

  // High-demand jobs compress the schedule — less discretionary time
  const highDemand=['banking','startup','founder'].includes(workType);
  const actualWorkEnd=highDemand&&workEnd<20?workEnd+1:workEnd;

  // Build windows around the real day
  const windows=[];

  // Sleep
  windows.push({start:0,end:wake-0.25,label:'sleep',activity:'deep sleep',desc:'Growth hormone peaks in slow-wave sleep. Every hour cut short reduces muscle repair and fat metabolism.'});

  // Wake + cortisol rise
  windows.push({start:wake-0.25,end:wake+0.5,label:'cortisol awakening',activity:'wake up',desc:'Cortisol spikes 50–100% above baseline in the first 30 minutes. Suppresses testosterone for ~45 minutes. Get sunlight now. Don\'t train yet.'});

  // Pre-work focus window (if there is one)
  if(workStart>wake+1.5){
    windows.push({start:wake+0.5,end:workStart,label:'pre-work focus',activity:'deep work',desc:'Acetylcholine is peaking, the neurotransmitter behind focus and pattern recognition. Caffeine now extends this window. After 11:00 it delays sleep onset.'});
  }

  // Work block — split based on flexibility
  if(flex==='full'||flex==='some'){
    windows.push({start:workStart,end:Math.min(workStart+3,13),label:'peak focus block',activity:'deep work',desc:'Prefrontal cortex at full capacity: working memory, decision quality, and verbal reasoning all peak now.'});
    if(workStart+3<13){
      windows.push({start:13,end:Math.min(14,actualWorkEnd),label:'communication block',activity:'meetings & email',desc:'Cortisol declining, social cognition still strong. Verbal fluency peaks here. Optimal for calls and negotiations.'});
    }
    const dipStart=Math.max(13,workStart+3);
    const dipEnd=Math.min(dipStart+1.5,actualWorkEnd);
    if(dipEnd>dipStart&&actualWorkEnd>14){
      windows.push({start:dipStart,end:dipEnd,label:'afternoon dip',activity:'low-stakes tasks',desc:'Core temperature drops ~0.5°C, the same trigger as sleep onset. A 20-minute rest enters Stage 2 sleep and restores alertness. Longer hits slow-wave and impairs waking.'});
    }
    if(actualWorkEnd>dipEnd+0.5){
      windows.push({start:dipEnd,end:actualWorkEnd,label:'late work block',activity:'collaborative work',desc:'A second cortisol curve emerges mid-afternoon. Reaction time and verbal processing return.'});
    }
  } else {
    windows.push({start:workStart,end:Math.min(actualWorkEnd,24),label:'work',activity:'work',desc:`Cortisol peaks in the first 2 hours of work. After 13:00 a biological dip reduces cognitive output. Use it for admin.`});
  }

  // Training
  if(trainStart>=actualWorkEnd||trainTime==='morning'){
    windows.push({start:trainStart,end:trainEnd,label:'training',activity:'Physical training',desc:'Muscle temperature runs about 1°C above baseline, tendon elasticity peaks and pain tolerance is elevated (exercise-induced hypoalgesia). This is when hard sets feel most achievable and stiffness-related injury risk is lowest.'});
  }

  // Sleep prep
  const sleepPrepStart=Math.max(actualWorkEnd,trainEnd,21);
  windows.push({start:sleepPrepStart,end:24,label:'sleep prep',activity:'prepare for sleep',desc:'Core temperature needs to drop 1°C to trigger sleep onset. A warm shower dilates skin vessels to release heat, accelerating the drop. Blue light delays melatonin by up to 3 hours.'});

  return windows;
}

// ── DAY STRUCTURE ────────────────────────────────────────────────────────────
// Meal/recovery windows anchor to wake & training; cognitive windows anchor to
// wake/bed and shift with chronotype (MSFsc offset, capped ±1.5h). Everything
// derives from wakeTime/bedTime/trainingTime — never fixed clock hours.
// trainingTime may be a decimal hour or one of morning/afternoon/evening.
function getDayWindows(p){
  const wake = p.wakeTime ?? p.wake, bed = p.bedTime ?? p.bed;
  if(wake == null || bed == null) return [];
  const tmap = { morning:7, afternoon:14, evening:20 };
  let train = (typeof p.trainingTime === 'number') ? p.trainingTime
            : (p.trainingTime && tmap[p.trainingTime] != null ? tmap[p.trainingTime] : null);
  if(p.trainingFreq === 'rest' || p.restDay === true) train = null;   // explicit rest day

  // Chronotype offset — cognitive phases only, and only the wake-anchored ones.
  let off = 0;
  const ct = (typeof computeChronotype === 'function') ? computeChronotype(p) : null;
  if(ct && ct.MSFsc != null) off = Math.max(-1.5, Math.min(1.5, ct.MSFsc - 4.0));

  const wins = [];
  const add = (name, category, start, end, level) => {
    if(start >= bed) return;            // window landing after bedtime → suppress
    wins.push({ name, category, level: level || null, start, end });
  };

  // Cognitive (wake-anchored, offset by chronotype). windDown is bed-anchored, so
  // it is NOT offset — offsetting it would push it past bedtime and suppress it.
  add('sleepInertia', 'cognitive', wake + off,       wake + 0.75 + off, 'STRONG');
  add('deepWork',     'cognitive', wake + 2 + off,   wake + 4.5 + off,  'MODERATE');
  add('trough',       'cognitive', wake + 6 + off,   wake + 8 + off,    'STRONG');
  add('secondWindow', 'cognitive', wake + 8.5 + off, wake + 10.5 + off, 'MODERATE');
  add('physicalPeak', 'cognitive', wake + 10 + off,  wake + 11.5 + off, 'MODERATE-STRONG');
  add('windDown',     'cognitive', bed - 1.5,        bed,               'MODERATE');

  // Meals & recovery (anchored to wake / training, never offset).
  add('breakfast', 'meal',     wake + 0.5, wake + 1.5,  null);
  add('lunch',     'meal',     wake + 4,   wake + 5,    null);
  add('dipWalk',   'recovery', wake + 5.5, wake + 5.75, null);
  if(train != null){
    if(train < wake + 7){
      // Early training: main meal would collide with lunch. One meal after training, no post-training.
      add('mainMeal', 'meal', train + 1.25, train + 2.25, null);
    } else {
      add('mainMeal',     'meal', train - 2.5,  train - 1.5,  null);
      add('postTraining', 'meal', train + 1.25, train + 1.75, null);
    }
  } else {
    add('mainMeal', 'meal', wake + 9, wake + 10, null);   // rest day / no training
  }
  return wins;
}

function fmt(n){const hh=Math.floor(n%24),mm=Math.round((n%1)*60);return hh.toString().padStart(2,'0')+':'+(mm<10?'0'+mm:mm);}

function getCurrentWindow(h,p){
  const windows=getWindows(p);
  return windows.find(w=>h>=w.start&&h<w.end)||windows[windows.length-1];
}

function windowTimeStr(h,p){
  const w=getCurrentWindow(h,p);
  return fmt(w.start)+'–'+fmt(w.end);
}

function windowProgress(h,p){
  const w=getCurrentWindow(h,p);
  const pct=((h-w.start)/(w.end-w.start))*100;
  return Math.min(Math.max(pct,2),98);
}

function windowRemaining(h,p){
  const w=getCurrentWindow(h,p);
  const mins=Math.round((w.end-h)*60);
  if(mins>=60){const hrs=Math.floor(mins/60),m=mins%60;return hrs+'h'+(m>0?' '+m+'m':'');}
  return mins+'m';
}

function buildSchedule(h,p){
  const windows=getWindows(p);
  return windows.map(w=>{
    const isActive=h>=w.start&&h<w.end;
    const isPast=h>=w.end;
    const activeStyle=isActive?'border-left:2px solid var(--orange);padding-left:10px;margin-left:-10px;':'';
    const windowColor=isActive?'var(--orange)':isPast?'rgba(26,22,18,0.22)':'rgba(26,22,18,0.4)';
    const activityColor=isActive?'var(--ink)':isPast?'rgba(26,22,18,0.28)':'var(--ink)';
    const descOpacity=isPast?'0.3':isActive?'0.65':'0.55';
    const nowPill=isActive?`<div style="display:inline-flex;align-items:center;gap:4px;margin-top:5px;"><div style="width:5px;height:5px;border-radius:50%;background:var(--orange);"></div><span style="font-size:10px;color:var(--orange);font-weight:500;letter-spacing:0.04em;">now</span></div>`:'';
    return`<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:0.5px solid var(--sep);${activeStyle}">
      <div style="font-size:10px;font-weight:500;letter-spacing:0.05em;color:${windowColor};margin-bottom:3px;">${fmt(w.start)}–${fmt(w.end)}</div>
      <div style="font-size:13px;font-weight:500;color:${activityColor};margin-bottom:3px;">${w.activity}</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.5;opacity:${descOpacity};">${w.desc}</div>
      ${nowPill}
    </div>`;
  }).join('').replace(/border-bottom[^;]+;(?=\s*$)/,'');
}

// Ask the unanswered field that would unlock the most rules next.
function getNextQuestion(){
  const eng = toContradictionProfile(profile);
  const ranked = nextBestQuestions(eng, 30);
  for(const {field} of ranked){
    const q = DAILY_QUESTIONS.find(x=>x.field===field);
    if(q && (profile[field]===undefined || profile[field]===null)) return q;
  }
  return DAILY_QUESTIONS.find(x=>profile[x.field]===undefined || profile[x.field]===null) || DAILY_QUESTIONS[0];
}

// Evidence badge (same treatment as the diagnosis evidence badges) + shared contradiction body.
function evidenceGrade(ev){
  const s=String(ev);
  const label=['MODERATE-STRONG','STRONG','MODERATE','WEAK'].find(x=>s.startsWith(x))||'MODERATE';
  const color=label==='STRONG'?'#4BB87B':label==='WEAK'?'rgba(26,22,18,0.3)':'rgba(26,22,18,0.45)';
  return {label,color};
}

// ── DAY STRIP ────────────────────────────────────────────────────────────────
// Horizontal wake→bed bar answering "what shape is my day". Cognitive tones on the
// clock's gold/grey axis (gold = sharp daylight, muted gold = neutral, grey = the
// valley); physicalPeak on its own ink line below (a different measurement); an orange
// now line. No labels; every segment taps to a popup. Cognitive windows live here,
// not on the clock.
const SHORT_NAME = { vitd:'vitamin D3', magnesium:'magnesium', omega3:'omega-3', zinc:'zinc', b12:'B12',
  k2:'vitamin K2', coq10:'CoQ10', ashwagandha:'ashwagandha', magnesium_threonate:'magnesium L-threonate',
  creatine:'creatine', iron:'iron' };
const WINDOW_NAME = { sleepInertia:'Sleep inertia', deepWork:'Deep work', trough:'Trough',
  secondWindow:'Second window', physicalPeak:'Physical peak', windDown:'Wind-down', neutral:'Steady',
  dipWalk:'Dip walk', breakfast:'Breakfast', lunch:'Lunch', mainMeal:'Main meal',
  postTraining:'Post-training meal', sleep:'Asleep' };
const WINDOW_LINE = {
  sleepInertia:'Grogginess in the first 30 to 60 minutes after waking. Do not judge the day by how you feel now, it lifts on its own.',
  deepWork:'Your sharpest focus of the day. Protect it for the hardest cognitive work and keep meetings out of it.',
  trough:'A dip built into your circadian rhythm, not a discipline problem. Put admin, email and mechanical work here rather than fighting through it.',
  secondWindow:'Alertness recovers into the early evening. A good slot for a second block of focused work.',
  physicalPeak:'Strength and power track core body temperature, which peaks now. The best window of the day for hard training.',
  windDown:'The last stretch before bed. Ease off cognitively so sleep pressure can take over.',
  neutral:'No strong peak or dip, a steady stretch. Fine for routine work, meetings and admin.',
  dipWalk:'Ten minutes outside now blunts the afternoon dip. Light is alerting through a different pathway than food, and it does not borrow from tonight.',
  breakfast:'Breakfast. Protein-forward, around 30g if you can, steadies the morning.',
  lunch:'Lunch. Keep it substantial enough to carry the afternoon.',
  mainMeal:'Your main meal, timed so it is digested before you train.',

  sleep:'Asleep, or heading there. Nothing to act on right now.'
};
window.openWindowPopup = function(name, start, end){
  const line = WINDOW_LINE[name]; if(!line) return;
  const NAMED = ['sleepInertia','deepWork','trough','secondWindow','physicalPeak','windDown'];
  let next = null;
  try{ next = getDayWindows(profile).filter(w=>NAMED.includes(w.name)).sort((a,b)=>a.start-b.start)
    .find(w => w.start >= end - 0.001 && w.name !== name); }catch(e){}
  document.getElementById('ci-question-title').textContent = `${WINDOW_NAME[name].toUpperCase()} · ${fmt(start)}–${fmt(end)}`;
  document.getElementById('ci-question-sub').textContent = '';

  document.getElementById('ci-question-body').innerHTML = `<div style="font-size:13px;color:var(--muted);line-height:1.6;">${line}</div>${nextHtml}`;
  const btn = document.getElementById('ci-action-btn'); btn.textContent = 'got it'; btn.setAttribute('onclick','closeCheckin()');
  document.getElementById('modal-overlay').classList.add('open');
