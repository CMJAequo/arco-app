<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arco</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arco">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1A1612">
  <link href="https://fonts.googleapis.com/css2?family=Switzer:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#EDE9E1;
  --card:#E4DED5;
  --card-peach:#F5C4A0;
  --ink:#1A1612;
  --orange:#E8520A;
  --orange-track:#F2C9B0;
  --muted:rgba(26,22,18,0.42);
  --sep:rgba(26,22,18,0.1);
  --radius:20px;
  --font:'Switzer',sans-serif;
}
body{font-family:var(--font);background:#d4cfc7;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0;}
.phone{width:390px;min-height:844px;background:var(--bg);border-radius:44px;overflow:visible;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.35);}
.screen{display:none;flex-direction:column;min-height:844px;overflow:visible;}
.screen.active{display:flex;}

/* STANDALONE PWA — edge to edge when launched from home screen */
@media (display-mode: standalone){
  body{background:#EDE9E1;padding:0;}
  .phone{width:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top);}
}

/* ONBOARDING */
.ob-header{background:var(--ink);padding:10px 24px 28px;}
.ob-logo{color:#EDE9E1;font-size:26px;font-weight:300;letter-spacing:-0.02em;}
.ob-sub{color:#EDE9E1;font-size:10px;opacity:0.38;letter-spacing:0.08em;margin-top:3px;}
.ob-body{flex:1;padding:28px 24px 32px;display:flex;flex-direction:column;overflow-y:auto;}
.step-bar{display:flex;gap:6px;margin-bottom:28px;}
.step-dot{height:3px;flex:1;border-radius:2px;background:rgba(26,22,18,0.1);transition:background 0.3s;}
.step-dot.done{background:var(--orange);}
.step-dot.active{background:var(--ink);}
.step-title{font-size:22px;font-weight:400;color:var(--ink);letter-spacing:-0.02em;line-height:1.25;margin-bottom:6px;}
.step-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:28px;}
.field-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;}
.field-input,.field-select{width:100%;background:var(--card);border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-family:var(--font);color:var(--ink);outline:none;margin-bottom:16px;transition:box-shadow 0.2s;-webkit-appearance:none;}
.field-input:focus,.field-select:focus{box-shadow:0 0 0 2px var(--orange);}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.chip{padding:9px 16px;border-radius:24px;font-size:13px;font-family:var(--font);background:var(--card);color:var(--ink);border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;}
.chip.sel-ink{background:var(--ink);color:#EDE9E1;}
.chip.sel-orange{background:var(--orange);color:#fff;border-color:var(--orange);}
.slider-wrap{margin-bottom:4px;}
.slider-row{display:flex;align-items:center;gap:12px;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--card);outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;}
.slider-val{font-size:13px;font-weight:500;color:var(--orange);min-width:20px;text-align:right;}
.slider-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;margin-bottom:16px;}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity 0.15s;margin-top:auto;}
.btn-ink{background:var(--ink);color:#EDE9E1;}
.btn-orange{background:var(--orange);color:#fff;}
.btn:hover{opacity:0.88;}

/* LOADING */
.loading-wrap{flex:1;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.loading-logo{color:#EDE9E1;font-size:36px;font-weight:300;letter-spacing:-0.03em;}
.loading-tag{color:#EDE9E1;font-size:11px;opacity:0.35;letter-spacing:0.08em;margin-top:6px;margin-bottom:48px;}
.loading-track{width:130px;height:2px;background:rgba(237,233,225,0.12);border-radius:1px;overflow:hidden;}
.loading-fill{height:100%;background:var(--orange);border-radius:1px;width:0%;transition:width 0.08s linear;}
.loading-msg{color:#EDE9E1;font-size:12px;opacity:0.35;margin-top:14px;letter-spacing:0.04em;}

/* LOGIN */
.login-wrap{flex:1;background:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 32px;}
.login-logo{color:#EDE9E1;font-size:44px;font-weight:300;letter-spacing:-0.03em;line-height:1;}
.login-tag{color:#EDE9E1;font-size:11px;opacity:0.35;letter-spacing:0.08em;margin-top:8px;margin-bottom:52px;}
.login-input{width:100%;padding:15px 18px;border:1px solid rgba(237,233,225,0.15);border-radius:14px;background:rgba(237,233,225,0.06);color:#EDE9E1;font-size:15px;font-family:var(--font);outline:none;text-align:center;margin-bottom:12px;transition:border-color 0.15s;-webkit-appearance:none;}
.login-input::placeholder{color:rgba(237,233,225,0.3);}
.login-input:focus{border-color:var(--orange);}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 20px;border:none;border-radius:14px;background:var(--orange);color:#fff;font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;transition:opacity 0.15s;}
.login-btn:hover{opacity:0.9;}
.login-note{color:#EDE9E1;opacity:0.3;font-size:11px;letter-spacing:0.06em;margin-top:20px;text-align:center;}
.login-sent-title{color:#EDE9E1;font-size:20px;font-weight:400;letter-spacing:-0.01em;margin-bottom:10px;}
.login-sent-sub{color:#EDE9E1;opacity:0.45;font-size:13px;line-height:1.6;margin-bottom:24px;}
.login-link{background:none;border:none;color:#EDE9E1;opacity:0.4;font-size:12px;font-family:var(--font);letter-spacing:0.04em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* DASHBOARD TOP BAR */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;background:var(--bg);}
.topbar-streak{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:20px;padding:6px 12px;}
.topbar-streak-count{color:var(--ink);font-size:12px;font-weight:500;}
.topbar-streak-label{color:var(--ink);font-size:12px;font-weight:500;}
.topbar-grid{display:flex;gap:3px;flex-wrap:wrap;width:18px;}
.topbar-grid span{width:7px;height:7px;background:var(--ink);border-radius:1px;display:block;opacity:0.5;}
.topbar-today{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:20px;padding:6px 12px;}
.topbar-today-label{font-size:12px;color:var(--ink);font-weight:500;}
.topbar-today-arrow{font-size:10px;color:var(--muted);}

/* DASH BODY */
.dash-body{flex:1;padding:0 16px;overflow-y:auto;padding-bottom:90px;}

/* ARC SCORE CARD */
.arc-card{background:var(--card);border-radius:var(--radius);padding:20px 20px 16px;margin-bottom:12px;}
.arc-label{font-size:10px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase;text-align:center;margin-bottom:16px;}
.arc-ring-wrap{display:flex;justify-content:center;margin-bottom:16px;}
.arc-divider{height:0.5px;background:var(--sep);margin:0 -4px 14px;}
.arc-stats{display:grid;grid-template-columns:repeat(3,1fr);}
.arc-stat{text-align:center;padding:0 8px;}
.arc-stat + .arc-stat{border-left:0.5px solid var(--sep);}
.arc-stat-label{font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.arc-stat-val{font-size:22px;font-weight:600;color:var(--ink);line-height:1;}
.arc-stat-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.arc-caption{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}

/* INSIGHT CARD */
.insight-card{background:var(--card-peach);border-radius:16px;padding:14px 16px;margin-bottom:12px;border-left:3px solid var(--orange);}
.insight-label{font-size:10px;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.insight-text{font-size:13px;color:var(--ink);line-height:1.6;}

/* NOW WINDOW CARD */
.now-card{background:var(--ink);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;}
.now-window-label{font-size:10px;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
.now-window-time{font-size:22px;font-weight:500;color:#EDE9E1;letter-spacing:-0.01em;margin-bottom:6px;}
.now-window-desc{font-size:13px;color:rgba(237,233,225,0.55);line-height:1.55;margin-bottom:14px;}
.now-window-bar{height:3px;background:rgba(237,233,225,0.12);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.now-window-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 0.5s ease;}
.now-window-footer{font-size:11px;color:rgba(237,233,225,0.35);}

/* SCHEDULE CARD */
.schedule-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.schedule-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px;}
.schedule-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:0.5px solid var(--sep);}
.schedule-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.schedule-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.schedule-content{flex:1;}
.schedule-window{font-size:10px;letter-spacing:0.05em;margin-bottom:2px;font-weight:500;}
.schedule-activity{font-size:13px;font-weight:500;}
.schedule-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;}
.schedule-active-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(232,82,10,0.12);border-radius:10px;padding:2px 8px;margin-top:4px;}
.schedule-active-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);}
.schedule-active-text{font-size:10px;color:var(--orange);font-weight:500;}

/* CHECKIN CARD */
.checkin-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.checkin-card-left{}
.checkin-card-title{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.checkin-card-sub{font-size:13px;color:var(--ink);}
.checkin-card-arrow{color:var(--muted);font-size:16px;}

/* HORMONE CURVE CARD */
.curve-card{background:var(--card);border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:12px;}
.curve-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.curve-card-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.legend{display:flex;gap:10px;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:10px;height:2px;border-radius:1px;}
.legend-label{font-size:9px;color:var(--muted);}

/* METRICS ROW */
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.metric-card{background:var(--card);border-radius:12px;padding:10px 12px;}
.metric-label{font-size:9px;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:4px;}
.metric-val{font-size:20px;font-weight:500;line-height:1;}

/* COACH CARD */
.coach-card{background:var(--card-peach);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;}
.coach-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-top:5px;flex-shrink:0;}
.coach-title{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:3px;}
.coach-text{font-size:12px;color:rgba(26,22,18,0.65);line-height:1.55;}

/* WEEK ROW */
.week-section-label{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;}
.week-row{display:flex;justify-content:space-between;margin-bottom:14px;flex-wrap:nowrap;}
.week-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.week-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.week-dot.done{background:var(--ink);}
.week-dot.wtoday{background:var(--orange);}
.week-dot.empty{border:0.5px solid var(--sep);}
.week-dot-label{font-size:9px;color:var(--muted);letter-spacing:0.04em;}
.week-dot-label.wtoday{color:var(--orange);}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:var(--bg);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
  border-top:0.5px solid var(--sep);
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  padding:8px 12px;
  border-radius:16px;
  min-width:56px;
  transition:background 0.15s;
}
.nav-item.active{background:var(--ink);}
.nav-item-label{font-size:9px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;}
.nav-item.active .nav-item-label{color:#EDE9E1;}
.nav-item:not(.active) .nav-item-label{color:var(--muted);}

/* MODAL */
.modal-overlay{position:absolute;inset:0;background:rgba(26,22,18,0.45);opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:50;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 24px 40px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);z-index:51;max-height:88%;overflow-y:auto;}
.modal-sheet.open{transform:translateY(0);}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--sep);margin:0 auto 20px;}
.modal-title{font-size:20px;font-weight:400;color:var(--ink);margin-bottom:4px;letter-spacing:-0.01em;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
</style>
</head>

<div class="phone">

</div>

<!-- ONBOARDING -->

  </div>

    <div class="nav-item" onclick="switchTab('learn',this)">

      <span class="nav-item-label">Learn</span>
    </div>
    <div class="nav-item" onclick="switchTab('progress',this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(26,22,18,0.3)" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span class="nav-item-label">Progress</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile',this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(26,22,18,0.3)" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="nav-item-label">Profile</span>
    </div>
  </nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeCheckin()"></div>
<div class="modal-sheet" id="checkin-modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="ci-question-title">today's question</div>
  <div class="modal-sub" id="ci-question-sub"></div>
  <div id="ci-question-body"></div>
  <button class="btn btn-ink" style="margin-top:20px;" onclick="submitCheckin()">log it →</button>
</div>

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v){return Math.min(1,Math.max(0,v));}
function baseVal(name,h){
  const c=CURVES[name];
  for(let i=0;i<c.length-1;i++){if(h>=c[i][0]&&h<c[i+1][0]){const t=(h-c[i][0])/(c[i+1][0]-c[i][0]);return lerp(c[i][1],c[i+1][1],t);}}
  return c[c.length-1][1];
}
function getHormones(h,p,mod={}){
  const wake=p.wake??7,sq=p.sleepQuality??3,stress=p.stress??2,train=p.trainingTime??'afternoon',caff=p.caffeine??'morning',age=parseInt(p.age)||25;
  let cor=baseVal('cortisol',h),mel=baseVal('melatonin',h),tes=baseVal('testosterone',h);
  cor=clamp(cor-(wake-7)*0.04);
  const sw=h-wake;if(sw>=0&&sw<0.5)cor=clamp(cor+0.18*(1-sw/0.5));
  const sqD=(sq-3)*0.07;cor=clamp(cor+sqD);tes=clamp(tes+sqD*0.8);mel=clamp(mel-sqD*0.2);
  const stD=(stress-2)*0.055;if(h>10&&h<22)cor=clamp(cor+stD);mel=clamp(mel-stD*0.25);
  if(train==='morning'&&h>=6&&h<=10)tes=clamp(tes+0.09);
  if(train==='afternoon'&&h>=15&&h<=19){tes=clamp(tes+0.10);cor=clamp(cor+0.05);}
  if(train==='evening'&&h>=18&&h<=21){tes=clamp(tes+0.07);mel=clamp(mel-0.12);}
  const agD=age<25?0.05:age>35?-0.08:-(age-25)*0.008;tes=clamp(tes+agD);
  if(caff==='afternoon'&&h>=19)mel=clamp(mel-0.10);
  if(caff==='evening'&&h>=18)mel=clamp(mel-0.22);
  cor=clamp(cor+(mod.cortisol??0));mel=clamp(mel+(mod.melatonin??0));tes=clamp(tes+(mod.testosterone??0));
  return{cortisol:cor,melatonin:mel,testosterone:tes};
}
function getPhase(h,p){
  const wake=p.wake??7;
  if(h<wake-0.25)return{label:'deep sleep',advice:'Growth hormone peaks now. Every hour cut short reduces muscle repair and fat metabolism.'};
  if(h<wake+0.5)return{label:'cortisol awakening',advice:'Cortisol at 50–100% above baseline. Suppresses testosterone for ~45 minutes. Get sunlight now. Don\'t train yet.'};
  if(h<wake+2.5)return{label:'peak cortisol',advice:'Acetylcholine peak — focus and pattern recognition at their highest. Caffeine now extends the window. After 11:00 it delays sleep onset.'};
  if(h<13)return{label:'peak focus',advice:'Prefrontal cortex at full capacity. Working memory, decision quality, verbal reasoning all peak now.'};
  if(h<15)return{label:'afternoon dip',advice:'Core temp dropped ~0.5°C — same trigger as sleep onset. 20 minutes enters Stage 2 sleep and restores alertness. Longer hits slow-wave and impairs waking.'};
  if(h<17.5)return{label:'recovery window',advice:'Second cortisol curve. Reaction time and verbal processing return. Muscle temp 1°C above baseline, injury risk at daily low.'};
  if(h<19.5)return{label:'wind down',advice:'Melatonin rising. Blue light delays it by up to 3 hours. Dim lights and reduce screen exposure now.'};
  if(h<21)return{label:'melatonin rising',advice:'Core temp falling. A warm shower dilates skin vessels to release heat, accelerating the drop and reducing sleep onset time.'};
  return{label:'sleep prep',advice:'Core temp needs to drop 1°C to trigger sleep onset. Room at 18°C. Every hour of delay compresses slow-wave sleep.'};
}
function arcScore(p,checkins,todayMod){
  const sq=p.sleepQuality??3;
  const stress=p.stress??2;
  const streak=getStreak(checkins);
  const trained=todayMod.trained===true?1:0;
  const sleepScore=(sq/5)*100;
  const stressScore=((5-stress)/4)*100;
  const streakScore=Math.min(streak/30,1)*100;
  const trainScore=trained*100;
  return Math.round(sleepScore*0.30+stressScore*0.30+streakScore*0.20+trainScore*0.20);
}
function arcLabel(score){
  if(score>=80)return'OPTIMAL';
  if(score>=60)return'REGULATED';
  return'DYSREGULATED';
}

function getStreak(ci){
  const dates=[...new Set((ci||checkins).map(c=>c.date))].sort().reverse();
  if(!dates.length)return 1;
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){if(dates.includes(d.toDateString())){s++;d.setDate(d.getDate()-1);}else break;}
  return Math.max(s,1);
}

// ── DIAGNOSIS ENGINE ──
function runDiagnosis(p){
  const month = new Date().getMonth()+1;
  const isWinter = [10,11,12,1,2,3,4].includes(month);
  const isVegan = p.diet==='vegan';
  const isVegetarian = p.diet==='vegetarian'||p.diet==='vegan';
  const noFish = p.fish==='never';
  const lowFish = p.fish==='sometimes'||p.fish==='never';
  const highAlcohol = p.alcohol==='high'||p.alcohol==='moderate';
  const trainsFrequently = ['3-4','5+'].includes(p.trainingFreq);
  const onMetformin = (p.meds||[]).includes('metformin');
  const onPPI = (p.meds||[]).includes('ppi');
  const onStatins = (p.meds||[]).includes('statins');
  const onWarfarin = (p.meds||[]).includes('warfarin');
  const highStress = p.stress>=4;
  const age = parseInt(p.age)||25;

  const results = [];

  // ── VITAMIN D ──
  const vitdReasons = [];
  let vitdScore = 0;
  if(isWinter){vitdScore+=3;vitdReasons.push('Zero cutaneous synthesis at this latitude October–April');}
  // Indoor workers with rare sunlight are deficient year-round regardless of season
  if(p.sunlight==='rarely'&&['banking','corporate','startup','founder'].includes(p.workType)){
    vitdScore+=3;vitdReasons.push('Indoor work 08:00–21:00 + rarely outdoors — effectively zero synthesis year-round');
  } else if(p.sunlight==='rarely'){vitdScore+=2;vitdReasons.push('Minimal outdoor sun exposure');}
  else if(p.sunlight==='sometimes'){vitdScore+=1;vitdReasons.push('Limited sun exposure');}
  if(trainsFrequently){vitdScore+=1;vitdReasons.push('Training sweat losses increase turnover');}
  if(vitdScore>=3) results.push({id:'vitd',confidence:'HIGH',score:vitdScore,reasons:vitdReasons,
    note:'Most people in Northern Europe are deficient October–April. This is the single highest-yield intervention for your profile.',
    contraindicated: false});

  // ── MAGNESIUM ──
  const mgReasons = [];
  let mgScore = 0;
  if(trainsFrequently){mgScore+=3;mgReasons.push('Sweat losses ~2.5–3 mg per session');}
  if(highAlcohol){mgScore+=2;mgReasons.push('Alcohol causes renal magnesium wasting');}
  if(onPPI){mgScore+=2;mgReasons.push('PPIs impair magnesium absorption — FDA hypomagnesemia warning');}
  if(highStress){mgScore+=1;mgReasons.push('Cortisol promotes renal magnesium wasting');}
  if(mgScore>=2) results.push({id:'magnesium',confidence:mgScore>=4?'HIGH':'MODERATE',score:mgScore,reasons:mgReasons,
    note:'Glycinate form specifically — oxide (most commonly sold) absorbs at ~4% vs glycinate at ~80%.',
    contraindicated: false});

  // ── OMEGA-3 ──
  const o3Reasons = [];
  let o3Score = 0;
  if(noFish){o3Score+=3;o3Reasons.push('No oily fish intake — primary dietary source is absent');}
  else if(lowFish){o3Score+=2;o3Reasons.push('Less than 2 portions of oily fish per week');}
  if(isVegetarian){o3Score+=2;o3Reasons.push('ALA to EPA conversion is less than 10% — plant sources insufficient');}
  if(o3Score>=2) results.push({id:'omega3',confidence:o3Score>=4?'HIGH':'MODERATE',score:o3Score,reasons:o3Reasons,
    note:'Check EPA content specifically — most capsules contain only ~300 mg EPA+DHA per 1,000 mg capsule.',
    contraindicated: false});

  // ── CREATINE ── (not a deficiency but high-evidence performance add)
  const crReasons = [];
  let crScore = 0;
  if(trainsFrequently){crScore+=3;crReasons.push('Resistance training amplifies creatine benefit significantly');}
  if(isVegetarian){crScore+=2;crReasons.push('Vegans and vegetarians have ~20–30% lower baseline muscle creatine');}
  if(crScore>=2) results.push({id:'creatine',confidence:'HIGH',score:crScore,reasons:crReasons,
    note:'Not a deficiency — the highest-evidence performance supplement that exists. 3–5 g/day monohydrate.',
    contraindicated: false});

  // ── ZINC ──
  const znReasons = [];
  let znScore = 0;
  if(isVegetarian){znScore+=3;znReasons.push('Phytate in grains and legumes chelates zinc. Requirements ~50% higher');}
  if(trainsFrequently){znScore+=2;znReasons.push('Sweat and urinary losses during training');}
  if(highAlcohol){znScore+=1;znReasons.push('Alcohol impairs zinc absorption');}
  if(znScore>=2) results.push({id:'zinc',confidence:znScore>=4?'HIGH':'MODERATE',score:znScore,reasons:znReasons,
    note:'Bisglycinate or picolinate form only — oxide is 43% less bioavailable. Pair with 1–2 mg copper.',
    contraindicated: false});

  // ── B12 ──
  const b12Reasons = [];
  let b12Score = 0;
  if(isVegan){b12Score+=5;b12Reasons.push('Vegan diet — B12 is absent from plant foods. Supplementation is mandatory');}
  else if(isVegetarian){b12Score+=3;b12Reasons.push('Vegetarian diet — limited dietary B12 sources');}
  if(onMetformin){b12Score+=3;b12Reasons.push('Metformin use — OR 4.72 for deficiency vs non-users (PLoS One 2018)');}
  if(onPPI){b12Score+=2;b12Reasons.push('PPIs reduce acid needed to release food-bound B12');}
  if(age>=50){b12Score+=2;b12Reasons.push('Absorption declines with age due to reduced intrinsic factor');}
  if(b12Score>=2) results.push({id:'b12',confidence:b12Score>=4?'HIGH':'MODERATE',score:b12Score,reasons:b12Reasons,
    note:'1,000 µg/day oral. Methyl vs cyano form makes minimal difference for most people despite marketing claims.',
    contraindicated: false});

  // ── ASHWAGANDHA ──
  const ashReasons = [];
  let ashScore = 0;
  if(highStress){ashScore+=3;ashReasons.push('Elevated stress — KSM-66 reduced cortisol ~27.9% in RCT (Chandrasekhar 2012)');}
  if(trainsFrequently&&highStress){ashScore+=1;ashReasons.push('Combined training stress + psychological stress increases HPA axis load');}
  if(ashScore>=3) results.push({id:'ashwagandha',confidence:'MODERATE',score:ashScore,reasons:ashReasons,
    note:'KSM-66 extract specifically at 600 mg/day. Effect accumulates over 4–8 weeks. Legal claim status in UK is unclear — avoid disease claims.',
    contraindicated: false});

  // ── COQ10 ──
  if(onStatins){
    results.push({id:'coq10',confidence:'MODERATE',score:3,
      reasons:['Statins inhibit HMG-CoA reductase — the shared pathway for both cholesterol and CoQ10 synthesis'],
      note:'Ubiquinol form. 100–200 mg/day with a fat-containing meal. Note: NICE does not currently recommend this for statin myopathy but depletion is real.',
      contraindicated: false});
  }

  // ── K2 ── contraindicated on warfarin
  if(!onWarfarin && vitdScore>=3){
    results.push({id:'k2',confidence:'MODERATE',score:2,
      reasons:['Vitamin D increases calcium absorption — K2 MK-7 directs it to bone, not arteries'],
      note:'MK-7 form, 90–180 µg/day. Synergistic with Vitamin D. ABSOLUTE contraindication if on warfarin.',
      contraindicated: false});
  }
  if(onWarfarin){
    results.push({id:'k2',confidence:'CONTRAINDICATED',score:0,
      reasons:['Warfarin detected — K2 directly antagonises vitamin K antagonist anticoagulants'],
      note:'Do not take K2 with warfarin without physician supervision.',
      contraindicated: true});
  }

  // Sort by score descending, contraindicated last
  results.sort((a,b)=>{
    if(a.contraindicated&&!b.contraindicated) return 1;
    if(!a.contraindicated&&b.contraindicated) return -1;
    return b.score-a.score;
  });

  return results;
}

function drawClock(h){
  const canvas=document.getElementById('main-clock');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=2;
  const cx=170*dpr,cy=170*dpr,r=104*dpr,inner=63*dpr,SW=26*dpr;
  ctx.clearRect(0,0,680,680);

  const wake=profile.wake??7;
  const workStart=profile.workStart??9;
  const workEnd=profile.workEnd??18;
  const trainTime=profile.trainingTime??'evening';
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5,22);

  // Color stops at specific hours — the ring flows through these
  // Format: [hour, r, g, b, brightness 0-1]
  // Sleep=dark amber, wake=bright yellow, focus=bright orange, work=dark grey,
  // recovery=gold, train=bright amber, wind=deep amber fading to dark
  const colorMap=[
    {h:0,    r:120,g:80, b:10},   // dark sleep — deep amber brown
    {h:wake-0.25,r:100,g:65,b:8}, // just before wake — slightly lighter
    {h:wake, r:255,g:214,b:10},   // wake — bright yellow
    {h:wake+1,r:255,g:160,b:10},  // peak cortisol — orange
    {h:workStart,r:80,g:75,b:60}, // work starts — muted dark
    {h:workStart+2,r:60,g:58,b:48},// deep work — darkest
    {h:workEnd-1,r:70,g:65,b:50}, // late work — still dark
    {h:workEnd,r:180,g:130,b:20}, // work ends — warming up
    {h:trainStart,r:255,g:190,b:10},// train start — bright gold
    {h:trainStart+0.75,r:255,g:160,b:5},// peak train — deep orange
    {h:trainEnd,r:200,g:140,b:15},// train ends — settling
    {h:22,   r:140,g:95,b:12},   // wind down — amber
    {h:23,   r:100,g:68,b:10},   // pre sleep — dark amber
    {h:24,   r:120,g:80,b:10},   // midnight — dark again
  ];

  function getColor(hour){
    for(let i=0;i<colorMap.length-1;i++){
      if(hour>=colorMap[i].h&&hour<colorMap[i+1].h){
        const t=(hour-colorMap[i].h)/(colorMap[i+1].h-colorMap[i].h);
        const ease=t<0.5?2*t*t:(4-2*t)*t-1; // smooth ease
        return{
          r:Math.round(colorMap[i].r+(colorMap[i+1].r-colorMap[i].r)*ease),
          g:Math.round(colorMap[i].g+(colorMap[i+1].g-colorMap[i].g)*ease),
          b:Math.round(colorMap[i].b+(colorMap[i+1].b-colorMap[i].b)*ease),
        };
      }
    }
    return colorMap[colorMap.length-1];
  }

  // Draw ring as tiny arc segments, each with interpolated color
  const STEPS=360;
  for(let i=0;i<STEPS;i++){
    const t0=i/STEPS,t1=(i+1)/STEPS;
    const h0=t0*24,h1=t1*24;
    const hMid=(h0+h1)/2;
    const a0=t0*Math.PI*2-Math.PI/2;
    const a1=t1*Math.PI*2-Math.PI/2;
    const c=getColor(hMid);
    const isActive=hMid>=h-0.5&&hMid<h+0.5; // near current time
    const isCurrent=hMid>=0&&hMid<=h; // passed hours always full bright? No — only current hour is brightest
    // Dimming: past and future are 55% brightness, current window is 100%
    const inCurrentWindow=(()=>{
      const wins=getWindowsSimple();
      return wins.some(w=>hMid>=w.s&&hMid<w.e&&h>=w.s&&h<w.e);
    })();
    const brightness=inCurrentWindow?1.0:0.45;
    const rr=Math.round(c.r*brightness+(255-255)*0+(inCurrentWindow?0:0));
    const gg=Math.round(c.g*brightness);
    const bb=Math.round(c.b*brightness);
    ctx.beginPath();
    ctx.arc(cx,cy,r,a0-0.002,a1+0.002);
    ctx.strokeStyle=`rgb(${rr},${gg},${bb})`;
    ctx.lineWidth=SW;
    ctx.lineCap='butt';
    ctx.stroke();
  }

  // Thin track behind — draw full circle in very dark first
  // (already rendered above, this gives depth)

  // Inner face
  ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fillStyle='#EDE9E1';ctx.fill();

  // Supplement markers — connector line → dot → label
  const ABBREV = {
    vitd:'D3', magnesium:'Mg', omega3:'ω3', zinc:'Zn',
    creatine:'Cr', ashwagandha:'Ash', b12:'B12', k2:'K2',
    coq10:'Q10', magnesium_threonate:'MgT', iron:'Fe'
  };
  const sups2 = profile.supplements || [];
  const hourGroups2 = {};
  sups2.forEach(key => {
    const s = SUPPLEMENTS[key]; if(!s) return;
    if(!hourGroups2[s.window[0]]) hourGroups2[s.window[0]] = [];
    hourGroups2[s.window[0]].push(key);
  });

  // Pulse factor — oscillates 0→1→0 over ~2 seconds
  const pulse = (Math.sin(Date.now() / 400) + 1) / 2;
  const dotR = 5*dpr;

  sups2.forEach(key => {
    const s = SUPPLEMENTS[key]; if(!s) return;
    const taken2 = takenToday.includes(key);
    const isDue2 = h >= s.window[0] && h < s.window[1];
    const group2 = hourGroups2[s.window[0]];
    const idx2 = group2.indexOf(key);
    const spread2 = group2.length > 1 ? (idx2 - (group2.length-1)/2) * 0.7 : 0;
    const ma2 = ((s.window[0] + spread2) / 24) * Math.PI * 2 - Math.PI / 2;

    const ringEdge  = r + SW/2;
    const dotDist   = ringEdge + 12*dpr;
    const lblDist   = ringEdge + 36*dpr;   // further from dot
    const lineStart = ringEdge + 3*dpr;

    const dx2 = cx + Math.cos(ma2) * dotDist;
    const dy2 = cy + Math.sin(ma2) * dotDist;
    const lx2 = cx + Math.cos(ma2) * lblDist;
    const ly2 = cy + Math.sin(ma2) * lblDist;
    const lnx1 = cx + Math.cos(ma2) * lineStart;
    const lny1 = cy + Math.sin(ma2) * lineStart;

    const dotCol = taken2 ? '#4BB87B' : isDue2 ? '#E8520A' : 'rgba(26,22,18,0.22)';
    const txtCol = taken2 ? '#4BB87B' : isDue2 ? '#E8520A' : 'rgba(26,22,18,0.32)';

    // No connector line — removed

    // Pulsating halo — only for due supplements
    if(isDue2 && !taken2){
      const haloR = dotR + (4 + pulse * 5) * dpr;
      ctx.beginPath();
      ctx.arc(dx2, dy2, haloR, 0, Math.PI*2);
      ctx.fillStyle = `rgba(232,82,10,${0.06 + pulse * 0.1})`;
      ctx.fill();
    }

    // Main dot
    ctx.beginPath();
    ctx.arc(dx2, dy2, dotR, 0, Math.PI*2);
    ctx.fillStyle = dotCol;
    ctx.fill();

    // Yellow pulsing centre — only for due
    if(isDue2 && !taken2){
      const coreR = (1.5 + pulse * 1.5) * dpr;
      ctx.beginPath();
      ctx.arc(dx2, dy2, coreR, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,214,0,${0.7 + pulse * 0.3})`;
      ctx.fill();
    }

    // Label — bigger, further out
    ctx.font = `600 ${9.5*dpr}px Switzer,sans-serif`;
    ctx.fillStyle = txtCol;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ABBREV[key] || key.slice(0,3).toUpperCase(), lx2, ly2);
  });

  // Hour labels — centered in grey band between inner face and ring
  const bandMid = inner + (r - SW/2 - inner) / 2;
  for(let i=0;i<24;i+=6){
    const a=(i/24)*Math.PI*2-Math.PI/2;
    ctx.font=`500 ${11*dpr}px Switzer,sans-serif`;
    ctx.fillStyle='rgba(26,22,18,0.38)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(i===0?'0':i+'h',cx+Math.cos(a)*bandMid,cy+Math.sin(a)*bandMid);
  }

  // Current time marker — pulsating
  const angle=(h/24)*Math.PI*2-Math.PI/2;
  const mx=cx+Math.cos(angle)*r,my=cy+Math.sin(angle)*r;
  const pulse2=(Math.sin(Date.now()/500)+1)/2; // 0→1→0
  // Outer pulsing halo
  const haloR2=(10+pulse2*8)*dpr;
  ctx.beginPath();ctx.arc(mx,my,haloR2,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${0.08+pulse2*0.12})`;
  ctx.fill();
  // White ring
  ctx.beginPath();ctx.arc(mx,my,8*dpr,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fill();
  // Dark centre
  ctx.beginPath();ctx.arc(mx,my,5*dpr,0,Math.PI*2);
  ctx.fillStyle='#1A1612';ctx.fill();
  // Pulsing bright yellow core
  const coreR=(2+pulse2*1.5)*dpr;
  ctx.beginPath();ctx.arc(mx,my,coreR,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,214,0,${0.8+pulse2*0.2})`;
  ctx.fill();
}

function getWindowsSimple(){
  const wake=profile.wake??7;
  const workStart=profile.workStart??9;
  const workEnd=profile.workEnd??18;
  const trainTime=profile.trainingTime??'evening';
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5,22);
  return[
    {s:0,e:wake-0.25},
    {s:wake-0.25,e:wake+0.5},
    {s:wake+0.5,e:workStart},
    {s:workStart,e:workEnd},
    {s:workEnd,e:trainStart},
    {s:trainStart,e:trainEnd},
    {s:trainEnd,e:24},
  ].filter(seg=>seg.s<seg.e);
}

function getWindows(p){
  const wake=p.wake??7;
  const workStart=p.workStart??9;
  const workEnd=p.workEnd??18;
  const workType=p.workType??'corporate';
  const flex=p.flexibility??'some';
  const trainTime=p.trainingTime??'evening';

  // Derive training window from profile
  const trainStart=trainTime==='morning'?wake+0.5:trainTime==='afternoon'?15:workEnd+0.5;
  const trainEnd=Math.min(trainStart+1.5, 22);

  // High-demand jobs compress the schedule — less discretionary time
  const highDemand=['banking','startup','founder'].includes(workType);
  const actualWorkEnd=highDemand&&workEnd<20?workEnd+1:workEnd;

  // Build windows around the real day
  const windows=[];

  // Sleep
  windows.push({start:0,end:wake-0.25,label:'sleep',activity:'deep sleep',desc:'Growth hormone peaks in slow-wave sleep. Every hour cut short reduces muscle repair and fat metabolism.'});

  // Wake + cortisol rise
  windows.push({start:wake-0.25,end:wake+0.5,label:'cortisol awakening',activity:'wake up',desc:'Cortisol spikes 50–100% above baseline in the first 30 minutes. Suppresses testosterone for ~45 minutes. Get sunlight now. Don\'t train yet.'});

  // Pre-work focus window (if there is one)
  if(workStart>wake+1.5){
    windows.push({start:wake+0.5,end:workStart,label:'pre-work focus',activity:'deep work',desc:'Acetylcholine is peaking — the neurotransmitter behind focus and pattern recognition. Caffeine now extends this window. After 11:00 it delays sleep onset.'});
  }

  // Work block — split based on flexibility
  if(flex==='full'||flex==='some'){
    windows.push({start:workStart,end:Math.min(workStart+3,13),label:'peak focus block',activity:'deep work',desc:'Prefrontal cortex at full capacity — working memory, decision quality, and verbal reasoning all peak now.'});
    if(workStart+3<13){
      windows.push({start:13,end:Math.min(14,actualWorkEnd),label:'communication block',activity:'meetings & email',desc:'Cortisol declining, social cognition still strong. Verbal fluency peaks here. Optimal for calls and negotiations.'});
    }
    const dipStart=Math.max(13,workStart+3);
    const dipEnd=Math.min(dipStart+1.5,actualWorkEnd);
    if(dipEnd>dipStart&&actualWorkEnd>14){
      windows.push({start:dipStart,end:dipEnd,label:'afternoon dip',activity:'low-stakes tasks',desc:'Core temperature drops ~0.5°C — same trigger as sleep onset. A 20-minute rest enters Stage 2 sleep and restores alertness. Longer hits slow-wave and impairs waking.'});
    }
    if(actualWorkEnd>dipEnd+0.5){
      windows.push({start:dipEnd,end:actualWorkEnd,label:'late work block',activity:'collaborative work',desc:'A second cortisol curve emerges mid-afternoon. Reaction time and verbal processing return.'});
    }
  } else {
    windows.push({start:workStart,end:Math.min(actualWorkEnd,24),label:'work',activity:'work',desc:`Cortisol peaks in the first 2 hours of work. After 13:00 a biological dip reduces cognitive output — use it for admin.`});
  }

  // Training
  if(trainStart>=actualWorkEnd||trainTime==='morning'){
    windows.push({start:trainStart,end:trainEnd,label:'training',activity:'Physical training',desc:'Muscle temperature 1°C above baseline, tendon elasticity peaks, pain tolerance elevated. Testosterone stays primed 15–45 minutes post-session — eat protein in that window.'});
  }

  // Sleep prep
  const sleepPrepStart=Math.max(actualWorkEnd,trainEnd,21);
  windows.push({start:sleepPrepStart,end:24,label:'sleep prep',activity:'prepare for sleep',desc:'Core temperature needs to drop 1°C to trigger sleep onset. A warm shower dilates skin vessels to release heat, accelerating the drop. Blue light delays melatonin by up to 3 hours.'});

  return windows;
}

function fmt(n){const hh=Math.floor(n%24),mm=Math.round((n%1)*60);return hh.toString().padStart(2,'0')+':'+(mm<10?'0'+mm:mm);}

function getCurrentWindow(h,p){
  const windows=getWindows(p);
  return windows.find(w=>h>=w.start&&h<w.end)||windows[windows.length-1];
}

function windowTimeStr(h,p){
  const w=getCurrentWindow(h,p);
  return fmt(w.start)+' — '+fmt(w.end);
}

function windowProgress(h,p){
  const w=getCurrentWindow(h,p);
  const pct=((h-w.start)/(w.end-w.start))*100;
  return Math.min(Math.max(pct,2),98);
}

function windowRemaining(h,p){
  const w=getCurrentWindow(h,p);
  const mins=Math.round((w.end-h)*60);
  if(mins>=60){const hrs=Math.floor(mins/60),m=mins%60;return hrs+'h'+(m>0?' '+m+'m':'');}
  return mins+'m';
}

function buildSchedule(h,p){
  const windows=getWindows(p);
  return windows.map(w=>{
    const isActive=h>=w.start&&h<w.end;
    const isPast=h>=w.end;
    const activeStyle=isActive?'border-left:2px solid var(--orange);padding-left:10px;margin-left:-10px;':'';
    const windowColor=isActive?'var(--orange)':isPast?'rgba(26,22,18,0.22)':'rgba(26,22,18,0.4)';
    const activityColor=isActive?'var(--ink)':isPast?'rgba(26,22,18,0.28)':'var(--ink)';
    const descOpacity=isPast?'0.3':isActive?'0.65':'0.55';
    const nowPill=isActive?`<div style="display:inline-flex;align-items:center;gap:4px;margin-top:5px;"><div style="width:5px;height:5px;border-radius:50%;background:var(--orange);"></div><span style="font-size:10px;color:var(--orange);font-weight:500;letter-spacing:0.04em;">now</span></div>`:'';
    return`<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:0.5px solid var(--sep);${activeStyle}">
      <div style="font-size:10px;font-weight:500;letter-spacing:0.05em;color:${windowColor};margin-bottom:3px;">${fmt(w.start)} — ${fmt(w.end)}</div>
      <div style="font-size:13px;font-weight:500;color:${activityColor};margin-bottom:3px;">${w.activity}</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.5;opacity:${descOpacity};">${w.desc}</div>
      ${nowPill}
    </div>`;
  }).join('').replace(/border-bottom[^;]+;(?=\s*$)/,'');
}

function buildWeekRow(){
  const today=new Date();
  const todayStr=today.toDateString();
  const dates=new Set(checkins.map(c=>c.date));
  const dayNames=['M','T','W','T','F','S','S'];
  // Find Monday of current week
  const monday=new Date(today);
  const dayOfWeek=today.getDay(); // 0=Sun, 1=Mon...
  const daysFromMonday=(dayOfWeek+6)%7; // Mon=0, Tue=1...Sun=6
  monday.setDate(today.getDate()-daysFromMonday);
  let html='<div class="week-row">';
  for(let i=0;i<7;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    const ds=d.toDateString();
    const isToday=ds===todayStr;
    const done=dates.has(ds);
    const isFuture=d>today&&!isToday;
    const ch=dayNames[i];
    let cls='week-dot empty',inner='';
    if(isToday&&done){cls='week-dot wtoday';inner=`<span style="font-size:11px;color:#fff;font-weight:600;">${ch}</span>`;}
    else if(isToday){cls='week-dot wtoday';inner=`<span style="font-size:11px;color:#fff;font-weight:500;">${ch}</span>`;}
    else if(done){cls='week-dot done';inner=`<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="#EDE9E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
    else if(isFuture){cls='week-dot empty';inner='';}
    html+=`<div class="week-day"><div class="${cls}">${inner}</div><div class="week-dot-label${isToday?' wtoday':''}" style="${isFuture?'opacity:0.3;':''}">${ch}</div></div>`;
  }
  return html+'</div>';
}

// ── SUPPLEMENT TAKEN STATE ──
const takenToday = JSON.parse(localStorage.getItem('arco-taken-'+new Date().toDateString())||'[]');
function markTaken(key){
  if(!takenToday.includes(key)){takenToday.push(key);}
  else{takenToday.splice(takenToday.indexOf(key),1);}
  try{localStorage.setItem('arco-taken-'+new Date().toDateString(),JSON.stringify(takenToday));}catch(e){}
  saveTakenRemote(key, takenToday.includes(key));
  buildDash();
}

function buildSupplementCard(h, p) {
  const sups = p.supplements || [];
  if (!sups.length) return '';

  const all = sups.map(key => ({key, ...SUPPLEMENTS[key]})).filter(s => s.name);
  const due = all.filter(s => h >= s.window[0] && h < s.window[1]);
  const laterToday = all.filter(s => s.window[0] > h).sort((a,b) => a.window[0] - b.window[0]);

  // Build cards for all due supplements
  let html = '';

  if (due.length) {
    due.forEach(s => {
      const taken = takenToday.includes(s.key);
      if(taken){
        // Checked state — green, fading
        html += `<div onclick="markTaken('${s.key}')" style="background:#1a3a1a;border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:10px;color:#4BB87B;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;font-weight:500;">taken</div>
            <div style="font-size:15px;font-weight:500;color:rgba(75,184,123,0.7);text-decoration:line-through;">${s.name}</div>
            <div style="font-size:11px;color:rgba(75,184,123,0.4);margin-top:2px;">${s.dose}</div>
          </div>
          <div style="width:28px;height:28px;border-radius:50%;background:#4BB87B;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>`;
      } else {
        html += `<div onclick="markTaken('${s.key}')" style="background:var(--ink);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;cursor:pointer;active:opacity:0.85;transition:opacity 0.15s;">
          <div style="font-size:10px;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:500;">take now</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <div style="font-size:15px;font-weight:500;color:#EDE9E1;">${s.name}</div>
            <div style="font-size:12px;color:rgba(237,233,225,0.4);">${s.dose}</div>
          </div>
          <div style="font-size:12px;color:rgba(237,233,225,0.5);line-height:1.55;">${s.reason}</div>
          <div style="margin-top:10px;height:1.5px;background:rgba(237,233,225,0.08);border-radius:1px;">
            <div style="height:100%;width:30px;background:rgba(237,233,225,0.2);border-radius:1px;"></div>
          </div>
          <div style="font-size:10px;color:rgba(237,233,225,0.25);margin-top:6px;">tap to mark taken</div>
        </div>`;
      }
    });
  }

  if (!due.length && laterToday.length) {
    const s = laterToday[0];
    html += `<div style="background:var(--card);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;">
      <div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;">supplement · ${fmt(s.window[0])}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:14px;font-weight:500;color:var(--ink);">${s.name}</div>
        <div style="font-size:12px;color:var(--muted);">${s.dose}</div>
      </div>
    </div>`;
  }

  return html;
}

function buildProtocolCard(h, p){
  const sups = p.supplements || [];
  if(!sups.length) return '';
  const all = sups.map(key => ({key, ...SUPPLEMENTS[key]})).filter(s => s.name);
  all.sort((a,b) => a.window[0] - b.window[0]);

  const rows = all.map(s => {
    const taken = takenToday.includes(s.key);
    const isDue = h >= s.window[0] && h < s.window[1];
    const isPast = h >= s.window[1];
    const rowId = 'sup-row-'+s.key;
    const detailId = 'sup-detail-'+s.key;

    let timeColor = 'var(--muted)';

    const checkCircle = `<div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${taken?'#4BB87B':isDue?'rgba(232,82,10,0.08)':'transparent'};border:${taken?'none':isDue?'1.5px solid var(--orange)':'0.5px solid var(--sep)'};" onclick="event.stopPropagation();markTaken('${s.key}')">

    return `<div id="${rowId}" style="padding:10px 0;border-bottom:0.5px solid var(--sep);opacity:${rowOpacity};transition:opacity 0.2s;">
      <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleSupDetail('${detailId}')">

  }).join('');

  const totalTaken = sups.filter(k => takenToday.includes(k)).length;

  return `<div style="background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;">

function drawCurve(h){
  const canvas=document.getElementById('main-curve');if(!canvas)return;
  const w=canvas.width,ch=canvas.height,ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,ch);
  [{key:'cortisol',color:'#E8520A'},{key:'melatonin',color:'#7B8FE8'},{key:'testosterone',color:'#4BB87B'}].forEach(({key,color})=>{
    ctx.beginPath();
    for(let i=0;i<=240;i++){
      const hh=(i/240)*24,v=getHormones(hh,profile,todayMod)[key],x=(hh/24)*w,y=ch-4-v*(ch-8);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
  });
  const cx=(h/24)*w;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,ch);
  ctx.strokeStyle='rgba(26,22,18,0.2)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);
}

function getInsight(score,p,phase){
  if(score<50)return'Your arc is dysregulated — prioritise sleep consistency above everything else this week.';
  if(score<70)return'You\'re building momentum. One more consistent night makes a measurable difference.';
  if(p.trainingTime==='evening')return'Note: evening training is elevating your cortisol at bedtime. Consider shifting one session earlier this week.';
  return'Your arc is in a strong position. Protect your current habits — this is where compounding starts.';
}

// ── REMOTE WRITES (fire-and-forget; never block the UI) ──
async function saveProfileRemote(){
  if(!currentUser) return;
  try{
    // Columns match the live schema: users(id, email, name, profile jsonb, supplements)
    await _supabase.from('users').upsert({
      id: currentUser.id,
      email: currentUser.email,
      name: profile.name,
      profile: profile,
      supplements: profile.supplements || []
    });
  }catch(e){console.warn('[arco] profile sync failed', e);}
}
async function saveTakenRemote(key, taken){
  if(!currentUser) return;
  const d = isoDate();
  try{
    // supplement_taken(user_id, supplement_key, date, taken_at, count) — a row means taken.
    await _supabase.from('supplement_taken').delete().eq('user_id',currentUser.id).eq('supplement_key',key).eq('date',d);
    if(taken){
      await _supabase.from('supplement_taken').insert({user_id:currentUser.id, supplement_key:key, date:d, taken_at:new Date().toISOString(), count:1});
    }
  }catch(e){console.warn('[arco] taken sync failed', e);}
}
async function saveCheckinRemote(questionKey, answer){
  if(!currentUser) return;
  const d = isoDate();
  try{
    // daily_logs(user_id, date, question_key, answer) — one row per day; replace on re-check-in.
    await _supabase.from('daily_logs').delete().eq('user_id',currentUser.id).eq('date',d);
    await _supabase.from('daily_logs').insert({user_id:currentUser.id, date:d, question_key:questionKey, answer:String(answer)});
  }catch(e){console.warn('[arco] checkin sync failed', e);}
}

// ── REMOTE READS (hydrate the local caches on load) ──
// Returns the stored profile, null if the user has no row, or undefined on a fetch error.
async function loadProfileRemote(){
  if(!currentUser) return null;
  try{
    const {data, error} = await _supabase.from('users').select('profile').eq('id', currentUser.id).maybeSingle();
    if(error) throw error;
    return data ? data.profile : null;
  }catch(e){console.warn('[arco] profile load failed', e); return undefined;}
}
async function hydrateFromRemote(){
  if(!currentUser) return;
  try{
    // A supplement_taken row for today = that supplement was taken.
    const {data:takenRows} = await _supabase.from('supplement_taken').select('supplement_key').eq('user_id',currentUser.id).eq('date',isoDate());
    if(takenRows){
      takenToday.length=0;
      takenRows.forEach(r=>takenToday.push(r.supplement_key));
      try{localStorage.setItem('arco-taken-'+new Date().toDateString(),JSON.stringify(takenToday));}catch(e){}
    }
  }catch(e){console.warn('[arco] taken load failed', e);}
  try{
    const {data:logRows} = await _supabase.from('daily_logs').select('date,question_key,answer').eq('user_id',currentUser.id).order('date',{ascending:true});
    if(logRows){
      // Rebuild local checkins ({date,key,value}); parse date as local to match toDateString() usage.
      checkins = logRows.map(r=>{const p=(r.date||'').split('-').map(Number); return {date:new Date(p[0],p[1]-1,p[2]).toDateString(), key:r.question_key, value:r.answer};});
      try{localStorage.setItem('arco-checkins',JSON.stringify(checkins));}catch(e){}
    }
  }catch(e){console.warn('[arco] logs load failed', e);}
}

// ── ROUTING ──
let _routing = false;
async function routeUser(session){
  if(_routing) return;
  _routing = true;
  try{
    if(!session){ currentUser=null; showScreen('screen-login'); return; }
    currentUser = session.user;
    const remoteProfile = await loadProfileRemote();
    // On a fetch error fall back to the offline cache so returning users aren't stranded.
    const localProfile = JSON.parse(localStorage.getItem('arco-profile')||'null');
    const chosen = (remoteProfile===undefined) ? localProfile : remoteProfile;
    if(chosen && chosen.supplements && chosen.supplements.length){
      profile = chosen;
      if(!profile.name || profile.name==='you') profile.name = (currentUser.email||'you').split('@')[0];
      try{localStorage.setItem('arco-profile',JSON.stringify(profile));}catch(e){}
      await hydrateFromRemote();
      showDash();
    } else {
      // Authenticated but no profile yet — run real onboarding from step one.
      currentStep = 0;
      showScreen('screen-onboard');
      renderStep();
    }
  } finally { _routing = false; }
}

// Initial session check, then react to future auth changes.
_supabase.auth.getSession().then(({data:{session}})=>routeUser(session));
_supabase.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_IN') routeUser(session);
  else if(event==='SIGNED_OUT'){ currentUser=null; showScreen('screen-login'); }
});
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js')
    .then(r => console.log('SW registered'))
    .catch(e => console.log('SW failed', e)));
}
</script>
